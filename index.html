/* Oihane 5.4 — Orgánico moderno: salvia, crema y madera clara */
:root{--bg:#f4f0e6;--card:#fffdf8;--ink:#30392f;--muted:#777d70;--olive:#77876c;--line:#e4dfd2;--accent:#e8eddf;--wood:#d8c2a4;--wood-light:#eee2d0}
body{background:radial-gradient(ellipse at 8% 0%,#faf7ef 0%,transparent 48%),var(--bg);color:var(--ink)}
.app{max-width:720px;padding-left:17px;padding-right:17px}
h1{letter-spacing:-.045em;font-weight:720}
.assistant,.upcoming,.panel,.integration-box{border-color:var(--line);box-shadow:0 4px 18px rgba(78,69,48,.035)}
.assistant{background:linear-gradient(120deg,#fffdf8 0%,#f8f5ed 100%);border-radius:20px}
.assistant button,.small-action,.task-controls button{background:#e8eddf;color:#485642}
.primary,.integration-box .integration-actions button.primary{background:var(--olive);color:#fffdf8;box-shadow:0 2px 4px rgba(58,75,51,.12)}
.primary:active,.small-action:active,.module:active{transform:translateY(1px) scale(.99)}
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.module{min-width:0;min-height:78px;border-radius:19px;background:linear-gradient(145deg,#fffdf8 0%,#f8f4eb 100%);border-color:#e5dfd2;box-shadow:0 3px 10px rgba(75,65,44,.045);transition:transform .14s ease,box-shadow .14s ease}
.module:hover{box-shadow:0 5px 14px rgba(75,65,44,.09)}
.emoji{font-size:29px;filter:saturate(.88)}
.dashboard-lead{background:linear-gradient(135deg,#e6ebdd 0%,#f8f3e9 74%,#eee0cc 100%);border-color:#e3ddcf}
.stat-pills span{background:rgba(255,253,248,.82);border-color:#e4dfd2}
.screen-head{margin-bottom:16px}
.back{border-radius:15px;background:linear-gradient(145deg,#fffdf8,#f2ecdf);box-shadow:0 2px 8px rgba(75,65,44,.04)}
.section-cards{gap:11px;margin-top:11px}
.section-card{border-color:#e3ddcf;border-radius:19px;background:linear-gradient(145deg,#fffdf8 0%,#fcfaf4 100%);box-shadow:0 3px 12px rgba(75,65,44,.035)}
.section-card-head{padding:15px 16px;min-height:53px}
.section-card-head strong{letter-spacing:.055em;color:#465341}
.section-card-head .section-chevron{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:#edf0e6;color:#64775a}
.section-card-body{padding:0 15px 13px}
.section-card-body .empty-list{padding:9px 0 4px}
.item{border-bottom-color:#eee8dc}
.item input[type=checkbox]{accent-color:var(--olive)}
.add-row input,.add-row select,.field input,.field select,.field textarea,.integration-box input{background:#fffdf8;border-color:#e1dacb;border-radius:13px}
.subtabs button{background:#f0ece2}
.subtabs button.active,.room-chip.active{background:#e7ecde;border-color:#cbd5bf}
.category-heading,.event-date,.item-link{color:#718365}
.recipe-ingredient,.tracking-panel{background:#f4f0e6;border-color:#e5dfd2}
.oihane-toast{background:#edf1e5;border-color:#b8c5ad}
/* Los módulos se representan mediante iconos; no hay etiquetas debajo. */
.module span:last-child{display:none}
/* Equilibrada: cuatro accesos por fila y tarjetas con separación moderada. */
@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.grid{gap:7px}.module{min-height:70px}.emoji{font-size:26px}}
@media(min-width:500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.module{min-height:86px}}

function collectBackupData(){const data={format:'oihane-backup',version:5,createdAt:new Date().toISOString(),data:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('oihane_')&&!/^oihane_(sync_|last_version|last_upgrade_at|last_export_at|shown_reminders)/.test(k)){try{data.data[k]=JSON.parse(localStorage.getItem(k))}catch{data.data[k]=localStorage.getItem(k)}}}data.data.oihane_tasks=tasks;data.data.oihane_products=products;data.data.oihane_events=events;return data}

function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());let incoming={};if(parsed?.format==='oihane-backup'&&parsed.data&&typeof parsed.data==='object'&&!Array.isArray(parsed.data))incoming=parsed.data;else if(parsed&&typeof parsed==='object'&&(parsed.tasks||parsed.products||parsed.events||parsed.extras)){incoming.oihane_tasks=parsed.tasks;incoming.oihane_products=parsed.products;incoming.oihane_events=parsed.events;Object.entries(parsed.extras||{}).forEach(([k,v])=>incoming['oihane_'+k]=v)}else{alert('El archivo no parece una copia válida de Oihane. No se ha cambiado ningún dato.');return}const valid=Object.entries(incoming).filter(([k,v])=>k.startsWith('oihane_')&&!/^oihane_(sync_|last_version|last_upgrade_at|last_export_at|shown_reminders)/.test(k)&&v!==undefined);if(!valid.length){alert('La copia no contiene datos reconocibles de Oihane.');return}const created=parsed.createdAt?new Date(parsed.createdAt).toLocaleString('es-ES'):'fecha desconocida';const mode=prompt('Archivo: '+file.name+'\nFecha de la copia: '+created+'\nMódulos/almacenes incluidos: '+valid.length+'\n\nElige cómo restaurar:\n1 = REEMPLAZAR los módulos incluidos (los datos locales de esos módulos se sustituirán).\n2 = FUSIONAR (solo añade elementos que falten; conserva los datos actuales).','2');if(!['1','2'].includes(mode||''))return;if(mode==='1'&&!confirm('Última comprobación: se reemplazarán los datos locales de los módulos incluidos. Descarga primero una copia de los datos actuales si no lo has hecho. ¿Continuar?'))return;for(const [k,v] of valid){if(mode==='1'){localStorage.setItem(k,JSON.stringify(v));continue}let old;try{old=JSON.parse(localStorage.getItem(k)||'null')}catch{}if(Array.isArray(old)&&Array.isArray(v)){const map=new Map(old.map((x,i)=>[String(x?.id??'old-'+i),x]));v.forEach((x,i)=>{const id=String(x?.id??'new-'+i);if(!map.has(id))map.set(id,x)});localStorage.setItem(k,JSON.stringify([...map.values()]))}else if(old===null)localStorage.setItem(k,JSON.stringify(v))}tasks=readStore('oihane_tasks');products=readStore('oihane_products');events=readStore('oihane_events');save();await writeLocalSnapshot();home();alert('Restauración completada. '+(mode==='2'?'Se han añadido los elementos que faltaban sin borrar los datos actuales.':'Se han reemplazado los módulos incluidos.'))}catch(e){alert('No se ha podido leer o restaurar la copia. No sigas haciendo cambios si sospechas que el almacenamiento está lleno; conserva el archivo JSON original.')}};input.click()}
function openModule(name,seed=''){screen=name; if(name==='Tareas')renderTasks(seed);else if(name==='Compras')renderShopping(seed);else if(name==='Calendario')renderCalendar(seed);else renderExtraModule(name,seed);window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;requestAnimationFrame(()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0})}
function renderTasks(seed=''){screen='Tareas';const pending=tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));document.querySelector('#app').innerHTML=`${unifiedHeader('Tareas')}<div class="dashboard-lead"><div class="eyebrow">Una lista, sin ruido</div><h2>${pending.length?`${pending.length} cosas por resolver`:'Todo al día ✨'}</h2><p>Ordenadas por fecha. Las tareas repetitivas vuelven a aparecer cuando toque.</p><div class="stat-pills"><span>${pending.filter(t=>t.date&&t.date<=today()).length} para hoy o atrasadas</span><span>${tasks.filter(t=>t.done).length} completadas</span></div></div><div class="module-toolbar"><span class="item-meta">PENDIENTES</span><button class="primary" type="button" onclick="toggleAddForm()">＋ Añadir tarea</button></div><section class="panel hidden" id="addPanel"><form id="taskForm"><div class="field"><label>Tarea</label><input id="taskInput" placeholder="¿Qué tienes que hacer?" value="${esc(seed)}" required></div><div class="field"><label>Fecha (opcional)</label><input id="taskDate" type="date"></div><div class="field"><label>Repetición</label><select id="taskRepeat"><option value="">Sin repetición</option><option>Diaria</option><option>Cada 2 días</option><option>Cada 3 días</option><option>Cada 4 días</option><option>Cada 5 días</option><option>Cada 6 días</option><option>Semanal</option><option>Cada 2 semanas</option><option>Cada 3 semanas</option><option>Cada 4 semanas</option><option>Mensual</option><option>Cada 2 meses</option><option>Cada 3 meses</option><option>Cada 6 meses</option><option>Anual</option><option>Días concretos</option><option>Personalizada</option></select></div><div class="field"><label>Intervalo personalizado (días)</label><input id="taskIntervalDays" type="number" min="1" max="365" value="7"></div><div class="field"><label>Días de la semana (para días concretos)</label><div class="subtabs" id="taskWeekdays">${["L","M","X","J","V","S","D"].map((d,i)=>`<label class="check-label"><input type="checkbox" value="${i+1}">${d}</label>`).join("")}</div></div><div class="field"><label>Importancia</label><select id="taskImportance"><option value="2">Normal</option><option value="3">Alta</option><option value="1">Baja</option></select></div><div class="field"><label>Categoría</label><select id="taskCategory"><option>Personal</option><option>Hogar</option><option>Trabajo</option><option>Salud</option><option>Estudio</option><option>Recados</option></select></div><div class="field"><label>Lugar (opcional)</label><input id="taskLocation" placeholder="Ej. supermercado, hospital…"></div><div class="field"><label>Contexto / vínculo (opcional)</label><input id="taskContext" placeholder="Ej. cuando esté en casa, compra, planta…"></div><div class="field"><label class="inline-check"><input id="taskNotify" type="checkbox"> Recordarme (requiere permiso del navegador)</label></div><div class="field"><label class="inline-check"><input id="taskShared" type="checkbox"> Compartida</label></div><button class="primary">Guardar tarea</button></form></section><section class="panel"><div id="taskList">${taskRows()}</div><div class="section-head" style="margin-top:14px"><h2>COMPLETADAS RECIENTEMENTE</h2><button id="completedHistoryButton" onclick="toggleCompletedHistory()">Ver historial completo</button></div><div id="completedTasks"></div></section>`;document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),title:document.querySelector('#taskInput').value.trim(),date:document.querySelector('#taskDate').value||'',repeat:document.querySelector('#taskRepeat').value,intervalDays:Number(document.querySelector('#taskIntervalDays').value||7),weekdays:[...document.querySelectorAll('#taskWeekdays input:checked')].map(x=>Number(x.value)),category:document.querySelector('#taskCategory').value,location:document.querySelector('#taskLocation').value.trim(),context:document.querySelector('#taskContext').value.trim(),importance:Number(document.querySelector('#taskImportance').value||2),notify:document.querySelector('#taskNotify').checked,shared:document.querySelector('#taskShared').checked,done:false,created:today(),completedAt:'',lastCompleted:''});save();renderTasks()};showCompletedTasks()}

function completeImportantTask(id){const t=tasks.find(x=>x.id===id);if(!t||t.done)return;t.done=true;t.completedAt=today();t.lastCompleted=today();if(t.repeat){const next=nextRepeatDate(t);tasks.push({...t,id:Date.now()+Math.floor(Math.random()*999),date:next,done:false,created:today(),completedAt:'',lastCompleted:today()})}save();home()}
function taskPriority(t){const due=t.date||'9999-12-31';const overdue=due<today()?100:due===today()?70:due===tomorrow()?45:0;return overdue+(Number(t.importance||2)*10)+(t.repeat?3:0)}
function taskRows(){let list=tasks.filter(t=>!t.done).sort((a,b)=>taskPriority(b)-taskPriority(a)||(a.date||'9999').localeCompare(b.date||'9999')||(a.location||'').localeCompare(b.location||''));return list.length?list.map(t=>`<div class="item"><input aria-label="Completar ${esc(t.title)}" type="checkbox" onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)} ${Number(t.importance)===3?'<span class="priority-high">· Alta</span>':''}</div><div class="item-meta">${t.date?fmt(t.date):'Sin fecha'}${t.repeat?' · '+esc(t.repeat):''}${t.category?' · '+esc(t.category):''}${t.location?' · 📍 '+esc(t.location):''}${t.context?' · '+esc(t.context):''}${t.notify?' · 🔔':''}${t.shared?' · Compartida':''}${t.lastCompleted?' · Última vez '+fmt(t.lastCompleted):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">No tienes tareas pendientes ✨</div>'}
function addMonthsClamped(date,months){const day=date.getDate();date.setDate(1);date.setMonth(date.getMonth()+months);const last=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();date.setDate(Math.min(day,last));return date}
function nextRepeatDate(t){let d=new Date((t.date||today())+'T12:00:00'),r=t.repeat||'';if(!r)return '';const m=r.match(/Cada (\d+) días?/i);if(m)d.setDate(d.getDate()+Number(m[1]));else if(r==='Diaria')d.setDate(d.getDate()+1);else if(r==='Semanal')d.setDate(d.getDate()+7);else if(r==='Cada 2 semanas')d.setDate(d.getDate()+14);else if(r==='Cada 3 semanas')d.setDate(d.getDate()+21);else if(r==='Cada 4 semanas')d.setDate(d.getDate()+28);else if(r==='Mensual')addMonthsClamped(d,1);else if(r==='Cada 2 meses')addMonthsClamped(d,2);else if(r==='Cada 3 meses')addMonthsClamped(d,3);else if(r==='Cada 6 meses')addMonthsClamped(d,6);else if(r==='Anual')addMonthsClamped(d,12);else if(r==='Días concretos'&&Array.isArray(t.weekdays)&&t.weekdays.length){for(let i=1;i<=7;i++){const c=new Date(d);c.setDate(c.getDate()+i);if(t.weekdays.includes(c.getDay()||7)){d=c;break}}}else if(r==='Personalizada')d.setDate(d.getDate()+Number(t.intervalDays||7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toggleTask(id){let t=tasks.find(t=>t.id===id);if(!t)return;if(!t.done){t.done=true;t.completedAt=today();t.lastCompleted=today();if(t.repeat){const next=nextRepeatDate(t);tasks.push({...t,id:Date.now()+Math.floor(Math.random()*999),date:next,done:false,created:today(),completedAt:'',lastCompleted:today()})}}else{t.done=false;t.completedAt=''}save();renderTasks()}
function deleteTask(id){if(!confirm('¿Eliminar esta tarea y su recurrencia actual?'))return;tasks=tasks.filter(t=>t.id!==id);save();renderTasks()}
let completedHistoryAll=false;function toggleCompletedHistory(){completedHistoryAll=!completedHistoryAll;showCompletedTasks();const b=document.querySelector('#completedHistoryButton');if(b)b.textContent=completedHistoryAll?'Mostrar recientes':'Ver historial completo'}function showCompletedTasks(){let el=document.querySelector('#completedTasks');if(!el)return;let done=tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));const total=done.length;if(!completedHistoryAll)done=done.slice(0,5);el.innerHTML=done.length?done.map(t=>`<div class="item done"><input type="checkbox" checked onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${t.completedAt?'Completada el '+fmt(t.completedAt):'Completada'}${t.lastCompleted?' · Última vez '+fmt(t.lastCompleted):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">Todavía no hay tareas completadas.</div>';const b=document.querySelector('#completedHistoryButton');if(b){b.textContent=completedHistoryAll?'Mostrar recientes':'Ver historial completo';b.style.display=total>5?'':'none'}}

function migrateProducts(){let changed=false;products=products.map(p=>{const lists=Array.isArray(p.lists)?[...new Set(p.lists)]:[...new Set(['General',p.store||'Lidl'])];const category=classifyProductCategory(p.title);const storeName=p.store||'Lidl';if(!Array.isArray(p.lists)||p.category!==category||p.store!==storeName)changed=true;return {...p,category,store:storeName,lists}});if(changed)save()}
migrateProducts();
function renderShopping(seed=''){screen='Compras';document.querySelector('#app').innerHTML=`${unifiedHeader('Compras')}<div class="subtabs">${['General','Lidl','Eroski','Mercadona'].map(s=>`<button class="${store===s?'active':''}" onclick="setStore('${s}')">${s}</button>`).join('')}</div><section class="panel"><h3>${store==='General'?'LISTA GENERAL':'LISTA DE '+store.toUpperCase()}</h3><form class="add-row" id="productForm"><input id="productInput" placeholder="Añadir producto…" value="${esc(seed)}" required><button class="primary">Añadir</button></form><div class="item-meta" id="productCategoryHint" style="margin:-3px 0 12px">Categoría automática: ${esc(classifyProductCategory(seed||''))}</div><div class="subtabs"><button class="${!showBought?'active':''}" onclick="setBought(false)">Pendientes</button><button class="${showBought?'active':''}" onclick="setBought(true)">Comprados</button></div><div>${productRows()}</div></section><p class="hint">La lista General reúne los productos pendientes; cada producto también pertenece a su tienda habitual. Los nuevos se asignan a Lidl salvo que elijas otra tienda. Los datos se guardan en este dispositivo.</p>`;document.querySelector('#productInput').oninput=e=>{const hint=document.querySelector('#productCategoryHint');if(hint)hint.textContent='Categoría automática: '+classifyProductCategory(e.target.value)};document.querySelector('#productForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#productInput').value.trim();if(!title)return;const assignedStore=store==='General'?'Lidl':store;products.push({id:Date.now(),title,store:assignedStore,lists:[...new Set(['General',assignedStore])],category:classifyProductCategory(title),bought:false,created:today()});selectedProductIds.clear();save();renderShopping()}}
function setStore(s){store=s;showBought=false;selectedProductIds.clear();renderShopping()}function setBought(b){showBought=b;selectedProductIds.clear();renderShopping()}
function toggleSelectedProduct(id,checked){if(checked)selectedProductIds.add(id);else selectedProductIds.delete(id);const bar=document.querySelector('#bulkActions');if(bar)bar.classList.toggle('hidden',selectedProductIds.size===0);const count=document.querySelector('#selectedCount');if(count)count.textContent=selectedProductIds.size}
function productRows(){let arr=products.filter(p=>(p.lists||[]).includes(store)&&p.bought===showBought);if(!arr.length)return '<div class="empty-list">'+(showBought?'Todavía no has comprado nada de esta lista.':'Tu lista está vacía. Añade lo que necesites.')+'</div>';const row=p=>`<div class="item ${p.bought?'done':''}"><label class="check-label"><input aria-label="Marcar ${esc(p.title)} como comprado" type="checkbox" ${p.bought?'checked':''} onchange="toggleProduct(${p.id})">Estado de compra</label><label class="check-label"><input aria-label="Seleccionar ${esc(p.title)} para mover o copiar" type="checkbox" ${selectedProductIds.has(p.id)?'checked':''} onchange="toggleSelectedProduct(${p.id},this.checked)">Elegir</label><div class="item-main"><div class="item-title">${esc(p.title)}</div>${store==='General'?`<div class="item-meta">${esc(p.category||'Otros')} · ${esc(p.store||'Lidl')}</div>`:''}${p.sourceRecipe?`<div class="item-meta">Receta: ${esc(p.sourceRecipe)}</div>`:''}${p.sourceHomeTitle?`<div class="item-meta">Hogar: ${esc(p.sourceHomeTitle)}</div>`:''}</div><button class="delete" aria-label="Quitar ${esc(p.title)} de esta lista" onclick="deleteProduct(${p.id})">×</button></div>`;let body='';if(store==='General'&&!showBought){const order=[...productCategories];for(const cat of order){const group=arr.filter(p=>(p.category||'Otros')===cat);if(group.length)body+=`<div class="category-heading">${esc(cat)}</div>${group.map(row).join('')}`}const other=arr.filter(p=>!order.includes(p.category||'Otros'));if(other.length)body+=`<div class="category-heading">Otros</div>${other.map(row).join('')}`}else body=arr.map(row).join('');return `${body}<div class="panel ${selectedProductIds.size?'':'hidden'}" id="bulkActions" style="padding:12px;margin-top:12px"><div class="item-meta"><span id="selectedCount">${selectedProductIds.size}</span> seleccionados</div><div class="field"><label>Mover o copiar a</label><select id="targetList">${['General','Lidl','Eroski','Mercadona'].filt function editCultureStatus(id){const items=extraItems('Cultura'),item=items.find(x=>x.id===id);if(!item)return;const options=item.kind==='Libro'?['Pendiente','Leído / visto']:item.kind==='Arte'?['Obra de arte','Quiero ver en persona']:item.kind==='Museo'?['Museo','Quiero ver en persona']:['Pendiente','Leído / visto'];const next=prompt('Estado disponible:\n'+options.map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\nEscribe el número:',String(Math.max(1,options.indexOf(item.status)+1)));if(next===null)return;const n=Number(next);if(!Number.isInteger(n)||n<1||n>options.length){alert('No he reconocido ese estado.');return}item.status=options[n-1];saveExtra('Cultura',items);renderExtraModule('Cultura')}

function cultureArtToTrip(id){const arts=extraItems('Cultura'),art=arts.find(x=>x.id===id);if(!art)return;const trips=extraItems('Viajes').filter(x=>x.status!=='Viaje realizado');if(!trips.length){if(confirm('No tienes viajes pendientes. ¿Quieres guardar el lugar en una nueva idea de viaje?')){const title=prompt('Nombre del destino',art.artCity||art.artPlace||'Destino cultural');if(!title)return;const trip={id:Date.now(),title,status:'Quiero ir',kind:'Destino',date:'',notes:'Lugar cultural para visitar: '+art.title+(art.creator?' · '+art.creator:'')+(art.link?' · '+art.link:''),location:art.artCity||art.artPlace||'',tripDetails:'Lugar cultural guardado desde Cultura.',created:today()};saveExtra('Viajes',[...extraItems('Viajes'),trip]);alert('He creado una idea de viaje vinculada a '+art.title+'.');return}return}const menu=trips.map((t,i)=>(i+1)+'. '+t.title+(t.date?' · '+fmt(t.date):'')).join('\n');const pick=prompt('¿A qué viaje quieres añadir esta obra o museo?\n'+menu+'\n\nEscribe el número:', '1');if(pick===null)return;const n=Number(pick);if(!Number.isInteger(n)||n<1||n>trips.length){alert('No he reconocido ese viaje.');return}const trip=trips[n-1],line='Lugar cultural: '+art.title+(art.creator?' · '+art.creator:'')+(art.artPlace?' · '+art.artPlace:'')+(art.artCity?' · '+art.artCity:'')+(art.link?' · '+art.link:'');if((trip.cultureLinks||[]).includes(art.id)){alert('Este elemento cultural ya está vinculado a «'+trip.title+'».');return}trip.tripDetails=(trip.tripDetails?trip.tripDetails+'\n':'')+line;trip.cultureLinks=[...(trip.cultureLinks||[]),art.id];saveExtra('Viajes',trips);art.linkedTripId=trip.id;saveExtra('Cultura',arts);alert('Añadido a «'+trip.title+'».');renderExtraModule('Cultura')}

function waterPlant(id){const items=extraItems('Plantas'),p=items.find(x=>x.id===id);if(!p)return;p.lastWatered=today();p.date=p.frequency?nextPlantDate(p):'';if(p.date&&p.date<=today())p.status='Necesita atención';else p.status='Bien';saveExtra('Plantas',items);renderExtraModule('Plantas')}
function nextPlantDate(p){const d=new Date((p.lastWatered||today())+'T12:00:00');d.setDate(d.getDate()+Number(p.frequency||7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseRecipeIngredient(line){let raw=String(line||'').trim().replace(/^[-•*]\s*/,'');if(!raw)return null;const pipe=raw.match(/^([^|]+)\|\s*(.+)$/);if(pipe){const qtyText=pipe[1].trim(),name=pipe[2].trim(),m=qtyText.match(/^([\d.,/ ]+)\s*(.*)$/);return {quantity:m?m[1].trim():'',unit:m?m[2].trim():'',name,display:(qtyText+' '+name).trim()}}const m=raw.match(/^((?:\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?))\s*(.*)$/);if(!m){const clean=raw.replace(/\s+al gusto\s*$/i,'').trim();return {quantity:'',unit:'',name:clean,display:clean}}let quantity=m[1].replace(/,/g,'.').replace(/\s/g,'').trim(),rest=m[2].trim();const units=/^(kg|g|mg|ml|cl|dl|l|cucharadas?|cucharaditas?|cdas?\.?|cdtas?\.?|tazas?|vasos?|latas?|ramas?|dientes?|rebanadas?|pizcas?|puñados?|hojas?|lonchas?|unidades?)\b\s*(?:de\s+)?(.*)$/i;const um=rest.match(units);let unit='',name=rest;if(um&&um[2].trim()){unit=um[1];name=um[2].trim()}else if(um&&!um[2].trim()){name=rest}return {quantity,unit,name,display:[quantity,unit,name].filter(Boolean).join(' ')}}
function parseRecipeIngredients(text){return String(text||'').split(/\r?\n|;|,\s+/).map(parseRecipeIngredient).filter(x=>x&&x.name.trim())}
function recipeIngredientsForDisplay(recipe){const items=parseRecipeIngredients(recipe.ingredients);const base=Number(recipe.servings)||1,current=Number(recipe.currentServings||recipe.servings)||base,ratio=current/base;return items.map(x=>{let quantity=x.quantity;if(quantity){let n;if(quantity.includes('/')){const parts=quantity.split('/');n=Number(parts[0])/Number(parts[1])}else n=Number(quantity);if(Number.isFinite(n)){const scaled=n*ratio;quantity=Number.isInteger(scaled)?String(scaled):String(Math.round(scaled*100)/100)}}return {...x,display:[quantity,x.unit,x.name].filter(Boolean).join(' ')}})}
function adjustRecipeServings(id){const items=extraItems('Recetas'),recipe=items.find(x=>x.id===id);if(!recipe)return;const next=prompt('¿Para cuántas personas quieres calcular esta receta?',String(recipe.currentServings||recipe.servings||2));if(next===null)return;const count=Number(next);if(!Number.isFinite(count)||count<1||count>100){alert('Introduce un número de raciones entre 1 y 100.');return}recipe.currentServings=String(count);saveExtra('Recetas',items);renderExtraModule('Recetas')}
function recipeToShopping(id){const r=extraItems('Recetas').find(x=>x.id===id);if(!r||!r.ingredients){alert('Añade los ingredientes de la receta primero.');return}const names=parseRecipeIngredients(r.ingredients).map(x=>x.name.trim()).filter(Boolean),norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(),seen=new Set(products.map(p=>norm(p.title)));let added=0;names.forEach(title=>{if(!seen.has(norm(title))){products.push({id:Date.now()+Math.floor(Math.random()*999999),title,store:'Lidl',lists:['General','Lidl'],category:classifyProductCategory(title),bought:false,created:today(),sourceRecipe:r.title,sourceRecipeId:r.id});seen.add(norm(title));added++}});save();if(added)alert(`Añadidos ${added} ingredientes (sin cantidades) a General y Lidl. Los que ya estaban en la lista no se duplicaron.`);else alert('Todos los ingredientes ya estaban en la lista de compra.')}
function cycleExtraStatus(name,id,section){const c=extraConfig[name],items=extraItems(name),item=items.find(x=>x.id===id);if(!item)return;if(name==='Hogar'&&item.status==='Seguimiento de pedidos'){updateHomeOrder(id);return}const order=name==='Wishlist'?['Idea','Buscando','Elegido','Comprado']:name==='Regalos'?['Idea','Buscando','Elegido','Comprado','Pedido','En camino','Entregado']:name==='Plantas'?['Bien','En observación','Necesita atención']:name==='Recetas'?['Esta semana','Quiero probar','Quiero aprender','Habitual','Cocinada']:name==='Viajes'?['Quiero ir','Próximamente','Viaje realizado']:name==='Planes'?['Sin fecha','Próximo','Realizado']:name==='Cultura'?['Pendiente','Leído / visto','Quiero ver en persona']:name==='Hogar'?['Cosas fijas que comprar','Inspiración','Opciones']:c.status;let idx=order.indexOf(item.status);item.status=order[(idx+1+order.length)%order.length]||order[0];saveExtra(name,items);renderExtraModule(name)}
function deleteExtra(name,id,section){if(!confirm('¿Quieres eliminar este elemento?'))return;saveExtra(name,extraItems(name).filter(i=>i.id!==id));if(name==='Planes'||name==='Estudio'){const linked=events.filter(e=>e.sourceModule===name&&e.sourceId===id);if(linked.length&&confirm('Este elemento tiene un evento enlazado. ¿Quieres eliminar también ese evento del calendario?')){events=events.filter(e=>!(e.sourceModule===name&&e.sourceId===id));save()}}renderExtraModule(name)}

function migrateProducts(){
 let changed=false;
 products=products.filter(p=>p&&typeof p==='object'&&!Array.isArray(p)).map(p=>{
  const oldLists=Array.isArray(p.lists)?p.lists:[];
  const validStores=['Lidl','Eroski','Mercadona'];
  let storeName=validStores.includes(p.store)?p.store:oldLists.find(x=>validStores.includes(x))||'Lidl';
  const lists=['General',storeName];
  const category=classifyProductCategory(p.title);
  if(p.store!==storeName||p.category!==category||p.bought!==!!p.bought||JSON.stringify(oldLists)!==JSON.stringify(lists))changed=true;
  return {...p,store:storeName,lists,category,bought:!!p.bought};
 });
 if(changed)save();
}

 function getTripCategory(t){const c=String(t.category||'').trim().toLocaleLowerCase('es');if(['próximo','proximo','próximos','proximos'].includes(c))return 'Próximo';if(['ideas','idea','quiero ir'].includes(c))return 'Ideas';if(['cuaderno de viajes','viajes realizados','viaje realizado'].includes(c))return 'Cuaderno de viajes';const st=String(t.status||'').trim().toLocaleLowerCase('es');if(['viaje realizado','realizado','completado'].includes(st))return 'Cuaderno de viajes';if(['próximamente','proximamente','próximo','proximo','próximos','proximos'].includes(st))return 'Próximo';return 'Ideas'}

 function inputField(label,id,value='',type='text',placeholder=''){return `<div class="v521-field"><label for="${id}">${label}</label><input id="${id}" type="${type||'text'}" value="${safe(value)}" placeholder="${safe(placeholder)}"></div>`}

 function openTripEditor(id){travelEdit=id||null;const t=id?arr('Viajes').find(x=>String(x.id)===String(id))||{}:{};travelDraft={stops:Array.isArray(t.stops)?JSON.parse(JSON.stringify(t.stops)):[],legs:Array.isArray(t.legs)?JSON.parse(JSON.stringify(t.legs)):[]};if(!travelDraft.stops.length&&t.location)travelDraft.stops=[{place:t.location,start:t.startDate||t.date||'',end:t.endDate||''}];if(!travelDraft.legs.length&&t.transport)travelDraft.legs=[{mode:t.transport,from:'',to:'',locator:''}];const modal=document.createElement('div');modal.id='v521Modal';modal.className='v521-modal-wrap';modal.innerHTML=`<form class="v521-modal" id="v521TripForm"><h2>${id?'Editar viaje':'Añadir viaje'}</h2>${inputField('Título del viaje / destino','v521TripTitle',t.title||t.location||'','','Ej. Japón · Tokio y Kioto')}${selectField('Categoría','v521TripCategory',tripCats,getTripCategory(t))}<div class="v521-two">${inputField('Fecha de inicio','v521TripStart',t.startDate||t.date||'','date')}${inputField('Fecha fin','v521TripEnd',t.endDate||'','date')}</div><label class="v521-check"><input id="v521Multi" type="checkbox" ${t.multipleDestinations||travelDraft.stops.length>1?'checked':''}> Destino múltiple (varias ciudades o etapas)</label><div class="v521-subform"><div class="v521-subhead"><strong>Etapas / destinos</strong><button type="button" class="small-action" id="v521AddStop">＋ Añadir destino</button></div><div id="v521Stops"></div></div><div class="v521-subform"><div class="v521-subhead"><strong>Transportes de ida, entre destinos y vuelta</strong><button type="button" class="small-action" id="v521AddLeg">＋ Añadir transporte</button></div><div id="v521Legs"></div><p class="v521-help">Puedes encadenar avión–avión–coche, trenes, vuelos de ida y vuelta u otros trayectos.</p></div><div class="v521-subform"><strong>Coche de alquiler</strong><label class="v521-check"><input id="v521Rental" type="checkbox" ${t.rentalCar?'checked':''}> Sí, necesito coche de alquiler</label><div class="v521-t  function getCultureType(i){if(i.kind==='Libro')return ['Leído / visto','Leído'].includes(i.status)?'Libro leído':'Libro pendiente';if(i.kind==='Arte')return 'Arte';return 'Película o serie'}

<script>
/* Oihane 5.26 — asistente conversacional local ampliado.

(function(){

 const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 function assistantDate(text){

   .replace(/\b(?:el\s+)?(?:próximo\s+|que viene\s+)?(?:lunes|martes|miércoles|jueves|viernes|sábado|domingo)\b/ig,' ')

   .replace(/\b(?:a\s+las?|sobre\s+las?|hacia\s+las?|para\s+las?)\s*\d{1,2}(?:(?::|[.h])\s*\d{2})?\s*(?:de\s+la\s+(?:mañana|tarde|noche))?/ig,' ')

 }
 function addEvent(raw,date,time,location){

 }
 function addTask(raw,date,location){

  const dupe=tasks.find(t=>!t.done&&duplicateTitle(t.title,title)&&String(t.date||'')===String(date||''));if(dupe){assistantSay('Esa tarea ya está en tu lista; no he creado un duplicado.');return}

 function addPlan(raw,date,time,location){

  let p=all.find(x=>duplicateTitle(x.title,title)&&String(x.date||'')===String(date||''));if(p){p.time=time||p.time||'';p.location=location||p.location||'';p.status=date?'Próximo':(p.status||'Sin fecha')}else{p={id:Date.now()+Math.floor(Math.random()*10000),title,status:date?'Próximo':'Sin fecha',date:date||'',time:time||'',location:location||'',people:'',notes:'Añadido con el asistente',created:today()};all.push(p)}

   const body=q.replace(/^(?:oye\s+)?(?:por favor\s+)?(?:recu[eé]rdame|no olvides|acu[eé]rdate de|crea una tarea|añade una tarea|anota una tarea|tarea para|tarea)\s*/i,'').replace(/\b(?:mañana|pasado mañana|hoy|el próximo\s+|el que viene\s+)?(?:lunes|martes|miércoles|jueves|viernes|sábado|domingo)\b/ig,' ').replace(/\b(?:mañana|pasado mañana|hoy)\b/ig,' ').replace(/\b(?:tengo que|debo|me falta por|pendiente de|no se me puede olvidar)\b/ig,' ').trim();

<script id="oihane-528-assistant">
(function(){

 function speak(text){if(!prefs.speak||!text||!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance)return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).slice(0,1200));u.lang='es-ES';u.rate=1;u.pitch=1;const voices=window.speechSynthesis.getVoices?.()||[];const spanish=voices.find(v=>/^es([-_]|$)/i.test(v.lang));if(spanish)u.voice=spanish;window.speechSynthesis.speak(u)}catch(e){}}
 function updateSpeakButton(){const b=$('.assistant .voice-speak-toggle');if(!b)return;b.setAttribute('aria-pressed',String(!!prefs.speak));b.textContent=prefs.speak?'🔊':'🔈';b.title=prefs.speak?'Desactivar respuestas habladas':'Activar respuestas habladas';b.setAttribute('aria-label',b.title)}

 function stopVoice(submit){if(!recognition){voiceActive=false;setVoiceUi(false);return}voiceShouldRun=!!submit;voiceActive=false;setVoiceUi(false,submit?'Procesando lo que has dicho…':'Dictado detenido.');try{recognition.stop()}catch(e){finishVoice()}}
 function finishVoice(){const text=(voiceFinal+' '+voiceInterim).trim();recognition=null;voiceActive=false;voiceShouldRun=false;setVoiceUi(false);if(!text){setVoiceUi(false,'No he recibido ninguna frase. Puedes intentarlo otra vez o usar el dictado del teclado.');return}const input=$('#ask');if(input)input.value=text;if(voiceShouldSubmit){/* compatibility placeholder */}runVoiceCommand(text)}

   recognition.onresult=function(e){let finalChunk='';let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)finalChunk+=res[0].transcript+' ';else interim+=res[0].transcript+' '}if(finalChunk)voiceFinal+=finalChunk;voiceInterim=interim;const input=$('#ask');if(input)input.value=(voiceFinal+' '+voiceInterim).trim();setVoiceUi(true,'Te escucho… Pulsa ■ para terminar y ejecutar la orden.')};

 };
 // Small local conversational context: follow-ups can update the task just created, without sending data anywhere.
 function parseFollowupDate(s){const t=String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(/\bpasado manana\b/.test(t))return parseRelativeDate('pasado mañana');if(/\bmanana\b/.test(t))return parseRelativeDate('mañana');if(/\bhoy\b/.test(t))return parseRelativeDate('hoy');const names=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];const m=t.match(/\b(?:el\s+)?(proximo\s+|que viene\s+)?(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/);if(m){const now=new Date();now.setHours(12,0,0,0);let delta=(names.indexOf(m[2])-now.getDay()+7)%7;if(delta===0)delta=7;if(m[1])delta+=7;now.setDate(now.getDate()+delta);return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')}return ''}
 function handleFollowup(raw){const l=String(raw||'').toLowerCase();if(lastActionType!=='task'||!lastTaskId)return false;const task=(typeof tasks!=='undefined'&&Array.isArray(tasks)?tasks:[]).find(t=>String(t.id)===String(lastTaskId));if(!task)return false;
  const date=parseFollowupDate(l);if(date&&/\b(ponla|ponlo|cambiala|cambialo|muevela|muevelo|pasala|pasalo|mejor|cambia|para el|para manana|para hoy|para el lunes|para el martes|para el miercoles|para el jueves|para el viernes|para el sabado|para el domingo)\b/.test(l)){const oldDate=task.date;task.date=date;if(typeof save==='function'&&save()===false){task.date=oldDate;responseBox().textContent='No he podido guardar el cambio de fecha. La tarea conserva su fecha anterior.';return true}if(typeof window.renderTasks==='function'&&typeof screen!=='undefined'&&screen==='Tareas')window.renderTasks();responseBox().textContent='He cambiado la fecha de «'+task.title+'» a '+(typeof window.fmt==='function'?window.fmt(date):date)+'.';return true}
  if(/\b(prioridad alta|muy importante|alta prioridad)\b/.test(l)){const old=task.importance;task.importance=3;if(typeof save==='function'&&save()===false){task.importance=old;responseBox().textContent='No he podido guardar el cambio de prioridad.';return true}responseBox().textContent='He marcado «'+task.title+'» como prioridad alta.';return true}
  if(/\b(prioridad baja|poco importante|baja prioridad)\b/.test(l)){const old=task.importance;task.importance=1;if(typeof save==='function'&&save()===false){task.importance=old;responseBox().textContent='No he podido guardar el cambio de prioridad.';return true}responseBox().textContent='He marcado «'+task.title+'» como prioridad baja.';return true}

 }
 const previous=window.handleAssistantCommand;
 if(typeof previous==='function')window.handleAssistantCommand=function(raw){
   const q=String(raw||'').trim();if(!q)return;
   if(handleFollowup(q)){const b=$('#assistantResult');if(b)speak(b.textContent);return}

   previous(q);
   const after=Array.isArray(window.tasks)?window.tasks:[];const created=after.filter(t=>!before.has(String(t.id))).sort((a,b)=>Number(b.id)-Number(a.id));
   if(created.length){lastTaskId=created[0].id;lastActionType='task'}else if(/\b(compra|comprar|leche|pan|huevos)\b/i.test(q)){lastActionType='shopping'}else if(/\b(cita|evento|calendario|reunion)\b/i.test(q)){lastActionType='event'}

})();

<script>
/* Oihane 5.29.2 — reparación de la pantalla Más.
   Reubica los paneles existentes o crea los que falten; no modifica datos locales. */
(function(){
  const repairStyles = document.createElement('style');
  repairStyles.textContent = `
    #oihaneSettingsRepair{display:grid!important;gap:12px;margin:12px 0 18px;visibility:visible!important;opacity:1!important}
    #oihaneSettingsRepair .integration-box{display:block!important;visibility:visible!important;opacity:1!important;margin:0!important}
    #oihaneSettingsRepair .dashboard-lead{display:block!important}
    #oihaneSettingsRepair .settings-version{font-size:11px;color:var(--muted);margin:0 0 3px}
  `;
  document.head.appendChild(repairStyles);
  const settingsMarkup = {
    backup: `<div class="integration-box" data-oihane-setting="backup"><h3>💾 Copias de seguridad y recuperación</h3><p>Descarga una copia JSON y guárdala en iCloud Drive. Oihane también conserva instantáneas locales de recuperación cuando el navegador lo permite.</p><div class="integration-actions"><button class="primary" type="button" onclick="exportBackup()">Descargar copia JSON</button><button type="button" onclick="importBackup()">Restaurar / fusionar copia</button><button type="button" onclick="recoverLocalSnapshot()">Recuperar copia local</button></div><div class="integration-status" id="localBackupStatus">Comprobando copia de recuperación…</div></div>`,
    sync: `<div class="integration-box" data-oihane-setting="sync"><h3>☁️ Sincronización entre dispositivos</h3><p>Configura tu cuenta privada de Supabase. La primera sincronización fusiona la información local con la nube; no borra tus datos locales.</p><div class="field"><label>URL del proyecto Supabase</label><input id="syncUrl" type="url" placeholder="https://xxxx.supabase.co" autocomplete="url"></div><div class="field"><label>Clave pública (publishable / anon)</label><input id="syncKey" type="password" autocomplete="off" placeholder="Clave pública del proyecto"></div><div class="field"><label>Correo de la cuenta</label><input id="syncEmail" type="email" autocomplete="email" placeholder="Tu correo"></div><div class="field"><label>Contraseña de la cuenta</label><input id="syncPassword" type="password" autocomplete="current-password" placeholder="No se guarda en Oihane"></div><div class="integration-actions"><button type="button" onclick="saveSyncConfig()">Guardar configuración</button><button type="button" onclick="cloudAuth('signup')">Crear cuenta</button><button type="button" onclick="cloudAuth('login')">Iniciar sesión</button><button class="primary" type="button" onclick="syncCloudNow()">Sincronizar ahora</button><button type="button" onclick="cloudLogout()">Desconectar</button></div><div class="sync-warning">Usa únicamente la clave pública de Supabase; nunca una clave service_role o secreta. La URL debe ser la dirección base del proyecto, sin /rest/v1/.</div><div class="integration-status" id="cloudStatus"></div></div>`,
    calendar: `<div class="integration-box" data-oihane-setting="calendar"><h3>📅 Calendario y avisos</h3><p>Exporta o importa eventos mediante archivos .ics. Los avisos del navegador dependen de los permisos de iOS; las notificaciones con la aplicación cerrada requieren una configuración adicional.</p><div class="integration-actions"><button class="primary" type="button" onclick="exportCalendarICS()">Exportar calendario para Apple</button><button type="button" onclick="openCalendarImport()">Importar archivo .ics</button><button type="button" onclick="requestNotificationPermission()">Activar avisos</button><button type="button" onclick="testNotification()">Probar aviso</button><button type="button" onclick="showIntegrationStatus()">Estado de integraciones</button></div><div class="integration-status" id="notifStatus"></div></div>`,
    voice: `<div class="integration-box" data-oihane-setting="voice"><h3>🎙️ Asistente de voz e instrucciones</h3><p>Prueba órdenes como «añade leche, pan y huevos a la compra», «recuérdame llamar al dentista mañana» o «¿qué tengo mañana?».</p><div class="integration-actions"><button class="primary" type="button" onclick="home();setTimeout(startVoiceInput,250)">Dictar una orden</button><button type="button" onclick="showAssistantHelp()">Ver órdenes disponibles</button></div><div class="integration-status" id="assistantStatus"></div></div>`
  };
  function ensureSettings(){
    const app=document.querySelector('#app');
    const header=app&&app.querySelector('.module-header[data-module="Más"]');
    if(!app||!header)return;
    let wrap=app.querySelector('#oihaneSettingsRepair');
    if(!wrap){wrap=document.createElement('div');wrap.id='oihaneSettingsRepair';header.insertAdjacentElement('afterend',wrap);}
    // Reuse cards already rendered by the original module instead of duplicating them.
    const oldBoxes=[...app.querySelectorAll('.integration-box')];
    for(const box of oldBoxes){
      if(wrap.contains(box))continue;
      let key=box.querySelector('#localBackupStatus')?'backup':box.querySelector('#syncUrl')?'sync':box.querySelector('#notifStatus')?'calendar':box.querySelector('#assistantStatus')?'voice':'';
      if(key){box.dataset.oihaneSetting=key;wrap.appendChild(box);}
    }
    for(const [key,markup] of Object.entries(settingsMarkup)){
      if(!wrap.querySelector(`[data-oihane-setting="${key}"]`)){
        const temp=document.createElement('div');temp.innerHTML=markup.trim();wrap.appendChild(temp.firstElementChild);
      }
    }
    // Keep settings visible above the existing Preferences / Integrations / Privacy sections.
    wrap.style.setProperty('display','grid','important');
    wrap.querySelectorAll('.integration-box').forEach(el=>{el.style.setProperty('display','block','important');el.style.setProperty('visibility','visible','important')});
    try{if(typeof restoreSettingsIntoUI==='function')restoreSettingsIntoUI()}catch(e){console.warn('No se pudieron restaurar los campos de configuración',e)}
    window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;
  }
  const previousOpen=window.openModule;
  if(typeof previousOpen==='function'){
    window.openModule=function(name,seed){
      const result=previousOpen.apply(this,arguments);
      if(name==='Más'){
        ensureSettings();
        requestAnimationFrame(()=>{ensureSettings();window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0});
      }
      return result;
    };
  }
  // If the page is already showing Más when this repair script runs, repair it in place.
  if(document.querySelector('#app .module-header[data-module="Más"]'))ensureSettings();
})();
</script>
