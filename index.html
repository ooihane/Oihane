<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Oihane"><link rel="manifest" href="manifest.json"><title>Oihane</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#30372c;--muted:#777b70;--olive:#7d8764;--line:#e8e2d5;--accent:#e8eddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:680px;margin:auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.date{font-size:13px;color:var(--muted)}h1{font-size:29px;margin:8px 0 18px;letter-spacing:-.04em}.assistant{display:flex;gap:10px;align-items:center;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:22px}.assistant .bubble{font-size:22px}.assistant input{background:transparent;border:0;outline:0;min-width:0;flex:1;color:var(--ink)}.assistant button{background:var(--accent);border-radius:12px;padding:9px 11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.section-head h2{font-size:12px;letter-spacing:.12em;margin:0;color:var(--muted)}.section-head button{background:none;color:var(--olive);font-size:13px}.upcoming{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:23px}.empty{font-size:14px;color:var(--muted);padding:6px 0}.event{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event-date{font-size:11px;color:var(--olive);min-width:50px;font-weight:700;text-transform:uppercase}.event-title{font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.module{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:102px;padding:15px 8px;text-align:center;color:var(--ink);box-shadow:0 2px 4px #3b392b05}.module:active{transform:scale(.98)}.emoji{font-size:27px;display:block;margin-bottom:9px}.module span:last-child{font-size:12px;font-weight:600}.screen-head{display:flex;align-items:center;gap:12px;margin:4px 0 22px}.back{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;color:var(--ink)}.screen-head h1{margin:0;font-size:25px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px}.panel h3{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 13px}.add-row{display:flex;gap:8px;margin-bottom:13px}.add-row input,.add-row select,.field input,.field select{min-width:0;flex:1;border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:12px;color:var(--ink)}.primary{background:var(--olive);color:white;padding:12px 15px;border-radius:12px;font-weight:600}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.subtabs button{background:#efecdf;color:var(--muted);border-radius:12px;padding:9px 12px;font-size:13px}.subtabs button.active{background:var(--accent);color:var(--ink);font-weight:700}.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.category-heading{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--olive);text-transform:uppercase;padding:13px 0 2px;border-bottom:1px solid var(--line)}.item input[type=checkbox]{accent-color:var(--olive);width:18px;height:18px}.check-label{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;font-size:9px;color:var(--muted)}.check-label input{margin:0}.item-main{flex:1;min-width:0}.item-title{font-size:14px;overflow-wrap:anywhere}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}.done .item-title{text-decoration:line-through;color:var(--muted)}.delete{background:transparent;color:#a09c90;font-size:18px;padding:4px 7px}.empty-list{color:var(--muted);font-size:14px;padding:10px 0}.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}.field textarea{min-width:0;width:100%;border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:12px;color:var(--ink);font:inherit;min-height:76px}.photo-preview{width:78px;height:78px;object-fit:cover;border-radius:13px;border:1px solid var(--line);flex-shrink:0}
.dashboard-lead{background:linear-gradient(135deg,#e9eddf,#fdfbf5 78%);border:1px solid var(--line);border-radius:20px;padding:19px;margin:0 0 15px}.dashboard-lead h2{font-size:22px;line-height:1.15;letter-spacing:-.035em;margin:8px 0}.dashboard-lead p{font-size:13px;line-height:1.5;color:var(--muted);margin:0;max-width:38ch}.stat-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.stat-pills span{background:#fffdf8;border:1px solid #e8e2d5;border-radius:999px;padding:6px 9px;font-size:11px;color:var(--ink)}.module-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}.module-toolbar .subtabs{margin:0;flex:1}.module-toolbar .primary{white-space:nowrap;font-size:12px;padding:10px 12px}.room-grid,.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.room-chip,.setting-tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;color:var(--ink);font-size:12px;line-height:1.35}.room-chip small,.setting-tile small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.setting-tile b{font-size:12px}.room-chip:active{background:var(--accent)}.panel .section-head h2{font-size:11px}.module-toolbar .subtabs button{padding:8px 10px}.dashboard-lead+.module-toolbar{margin-top:17px}
.item-actions{display:flex;gap:5px;align-items:center}.small-action{background:var(--accent);color:var(--ink);border-radius:9px;padding:7px 9px;font-size:11px}.item-photo{width:56px;height:56px;object-fit:cover;border-radius:12px;flex-shrink:0}.field input[type=file]{padding:8px;background:transparent}.hidden{display:none!important}@media(min-width:500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.module{min-height:112px}}
</style></head><body><main class="app" id="app"></main>
<script>
const modules=[['🛒','Compras'],['📅','Calendario'],['❤️','Wishlist'],['🎁','Regalos'],['🏡','Hogar'],['🌱','Plantas'],['🍝','Recetas'],['📖','Estudio'],['✈️','Viajes'],['🎨','Cultura'],['🗓️','Planes'],['📋','Tareas'],['⚙️','Más']];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const readStore=(key)=>{try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}};const fmt=d=>{if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})};
let tasks=readStore('oihane_tasks'), products=readStore('oihane_products'), events=readStore('oihane_events');let screen='home',store='Lidl',showBought=false;let selectedProductIds=new Set();const productCategories=['Fruta y verdura','Carne y pescado','Lácteos y huevos','Panadería','Despensa','Congelados','Bebidas','Limpieza','Higiene','Otros'];
const save=()=>{localStorage.setItem('oihane_tasks',JSON.stringify(tasks));localStorage.setItem('oihane_products',JSON.stringify(products));localStorage.setItem('oihane_events',JSON.stringify(events))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){screen='home';let d=new Date(), greeting=d.getHours()<12?'Buenos días':d.getHours()<20?'Buenas tardes':'Buenas noches';let upcoming=events.filter(e=>e.date>=today()&&e.date<=tomorrow()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);document.querySelector('#app').innerHTML=`<div class="top"><div class="eyebrow">Tu espacio personal</div><div class="date">${d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}</div></div><h1>${greeting}, Oihane 👋</h1><form class="assistant" id="assistant"><span class="bubble">✳️</span><input id="ask" placeholder="¿En qué te ayudo?" autocomplete="off"><button aria-label="Enviar">↗</button></form><div class="section-head"><h2>PRÓXIMAMENTE</h2><button onclick="openModule('Calendario')">Ver calendario</button></div><section class="upcoming">${upcoming.length?upcoming.map(e=>`<div class="event"><div class="event-date">${e.date===today()?'HOY':e.date===tomorrow()?'MAÑANA':fmt(e.date)}${e.time?'<br>'+esc(e.time):''}</div><div class="event-title">${esc(e.title)}${e.location?`<div class="item-meta">📍 ${esc(e.location)}</div>`:''}</div></div>`).join(''):'<div class="empty">De momento, tu agenda está tranquila 🌿</div>'}</section><div class="section-head"><h2>TUS ESPACIOS</h2></div><div class="grid">${modules.map(m=>`<button class="module" onclick="openModule('${m[1]}')"><span class="emoji">${m[0]}</span><span>${m[1]}</span></button>`).join('')}</div>`;document.querySelector('#assistant').onsubmit=e=>{e.preventDefault();let q=document.querySelector('#ask').value.trim();if(!q)return;if(/compra|leche|supermercado/i.test(q)){openModule('Compras',q)}else if(/tarea|pendiente|limpiar|estudiar/i.test(q)){openModule('Tareas',q)}else if(/calendario|evento|cita/i.test(q)){openModule('Calendario',q)}else{alert('El asistente inteligente aún está pendiente. Por ahora puedes entrar en Compras, Tareas o Calendario para guardar esa información.')}}}
function openModule(name,seed=''){screen=name; if(name==='Tareas')renderTasks(seed);else if(name==='Compras')renderShopping(seed);else if(name==='Calendario')renderCalendar(seed);else renderExtraModule(name,seed)}
function renderTasks(seed=''){screen='Tareas';const pending=tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()" aria-label="Volver al inicio">‹</button><h1>📋 Tareas</h1></div><div class="dashboard-lead"><div class="eyebrow">Una lista, sin ruido</div><h2>${pending.length?`${pending.length} cosas por resolver`:'Todo al día ✨'}</h2><p>Ordenadas por fecha. Las tareas repetitivas vuelven a aparecer cuando toque.</p><div class="stat-pills"><span>${pending.filter(t=>t.date&&t.date<=today()).length} para hoy o atrasadas</span><span>${tasks.filter(t=>t.done).length} completadas</span></div></div><div class="module-toolbar"><span class="item-meta">PENDIENTES</span><button class="primary" type="button" onclick="toggleAddForm()">＋ Añadir tarea</button></div><section class="panel hidden" id="addPanel"><form id="taskForm"><div class="field"><label>Tarea</label><input id="taskInput" placeholder="¿Qué tienes que hacer?" value="${esc(seed)}" required></div><div class="field"><label>Fecha (opcional)</label><input id="taskDate" type="date"></div><div class="field"><label>Repetición</label><select id="taskRepeat"><option value="">Sin repetición</option><option>Diaria</option><option>Cada 2 días</option><option>Semanal</option><option>Cada 2 semanas</option><option>Mensual</option><option>Anual</option></select></div><div class="field"><label>Categoría</label><select id="taskCategory"><option>Personal</option><option>Hogar</option><option>Trabajo</option><option>Salud</option><option>Estudio</option><option>Recados</option></select></div><div class="field"><label>Lugar (opcional)</label><input id="taskLocation" placeholder="Ej. supermercado, hospital…"></div><button class="primary">Guardar tarea</button></form></section><section class="panel"><div id="taskList">${taskRows()}</div><div class="section-head" style="margin-top:14px"><h2>COMPLETADAS RECIENTEMENTE</h2><button onclick="showCompletedTasks()">Ver historial</button></div><div id="completedTasks"></div></section>`;document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),title:document.querySelector('#taskInput').value.trim(),date:document.querySelector('#taskDate').value,repeat:document.querySelector('#taskRepeat').value,category:document.querySelector('#taskCategory').value,location:document.querySelector('#taskLocation').value.trim(),done:false});save();renderTasks()}}

function taskRows(){let list=tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return list.length?list.map(t=>`<div class="item"><input type="checkbox" onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${t.date?fmt(t.date):'Sin fecha'}${t.repeat?' · '+esc(t.repeat):''}${t.category?' · '+esc(t.category):''}${t.location?' · 📍 '+esc(t.location):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">No tienes tareas pendientes ✨</div>'}
function toggleTask(id){let t=tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();renderTasks()}function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);save();renderTasks()}function showCompletedTasks(){let el=document.querySelector('#completedTasks');let done=tasks.filter(t=>t.done);el.innerHTML=done.length?done.map(t=>`<div class="item done"><input type="checkbox" checked onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">Todavía no hay tareas completadas.</div>'}
function migrateProducts(){let changed=false;products=products.map(p=>{if(!Array.isArray(p.lists)){changed=true;return {...p,category:p.category||'Otros',lists:[...new Set(['General',p.store||'Lidl'])]}}if(!p.category){changed=true;return {...p,category:'Otros'}}return p});if(changed)save()}
migrateProducts();
function renderShopping(seed=''){screen='Compras';document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()">‹</button><h1>🛒 Compras</h1></div><div class="subtabs">${['General','Lidl','Eroski','Mercadona'].map(s=>`<button class="${store===s?'active':''}" onclick="setStore('${s}')">${s}</button>`).join('')}</div><section class="panel"><h3>${store==='General'?'LISTA GENERAL':'LISTA DE '+store.toUpperCase()}</h3><form class="add-row" id="productForm"><input id="productInput" placeholder="Añadir producto…" value="${esc(seed)}" required><button class="primary">Añadir</button></form><div class="field"><label>Categoría</label><select id="productCategory">${productCategories.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="subtabs"><button class="${!showBought?'active':''}" onclick="setBought(false)">Pendientes</button><button class="${showBought?'active':''}" onclick="setBought(true)">Comprados</button></div><div>${productRows()}</div></section><p class="hint">La lista general es independiente. Los productos nuevos se asignan a Lidl por defecto cuando los añades a General. Los datos se guardan en este dispositivo.</p>`;document.querySelector('#productForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#productInput').value.trim();if(!title)return;const assignedStore=store==='General'?'Lidl':store;products.push({id:Date.now(),title,store:assignedStore,lists:[store],category:document.querySelector('#productCategory').value,bought:false});selectedProductIds.clear();save();renderShopping()}}
function setStore(s){store=s;showBought=false;selectedProductIds.clear();renderShopping()}function setBought(b){showBought=b;selectedProductIds.clear();renderShopping()}
function toggleSelectedProduct(id,checked){if(checked)selectedProductIds.add(id);else selectedProductIds.delete(id);const bar=document.querySelector('#bulkActions');if(bar)bar.classList.toggle('hidden',selectedProductIds.size===0);const count=document.querySelector('#selectedCount');if(count)count.textContent=selectedProductIds.size}
function productRows(){let arr=products.filter(p=>(p.lists||[]).includes(store)&&p.bought===showBought);if(!arr.length)return '<div class="empty-list">'+(showBought?'Todavía no has comprado nada de esta lista.':'Tu lista está vacía. Añade lo que necesites.')+'</div>';const row=p=>`<div class="item ${p.bought?'done':''}"><label class="check-label"><input aria-label="Marcar ${esc(p.title)} como comprado" type="checkbox" ${p.bought?'checked':''} onchange="toggleProduct(${p.id})">Hecho</label><label class="check-label"><input aria-label="Seleccionar ${esc(p.title)} para mover o copiar" type="checkbox" ${selectedProductIds.has(p.id)?'checked':''} onchange="toggleSelectedProduct(${p.id},this.checked)">Elegir</label><div class="item-main"><div class="item-title">${esc(p.title)}</div>${store==='General'?`<div class="item-meta">${esc(p.category||'Otros')} · ${esc(p.store||'Lidl')}</div>`:''}</div><button class="delete" aria-label="Quitar ${esc(p.title)} de esta lista" onclick="deleteProduct(${p.id})">×</button></div>`;let body='';if(store==='General'&&!showBought){const order=[...productCategories];for(const cat of order){const group=arr.filter(p=>(p.category||'Otros')===cat);if(group.length)body+=`<div class="category-heading">${esc(cat)}</div>${group.map(row).join('')}`}const other=arr.filter(p=>!order.includes(p.category||'Otros'));if(other.length)body+=`<div class="category-heading">Otros</div>${other.map(row).join('')}`}else body=arr.map(row).join('');return `${body}<div class="panel ${selectedProductIds.size?'':'hidden'}" id="bulkActions" style="padding:12px;margin-top:12px"><div class="item-meta"><span id="selectedCount">${selectedProductIds.size}</span> seleccionados</div><div class="field"><label>Mover o copiar a</label><select id="targetList">${['General','Lidl','Eroski','Mercadona'].filter(x=>x!==store).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="add-row"><button class="primary" type="button" onclick="moveSelectedProducts(false)">Mover</button><button class="primary" type="button" onclick="moveSelectedProducts(true)">Copiar</button><button type="button" onclick="clearProductSelection()" style="background:#efecdf;border-radius:12px;padding:10px">Cancelar</button></div><div class="hint">Marca la segunda casilla de cada producto para seleccionarlo. La primera sirve para marcarlo como comprado.</div></div>`}
function clearProductSelection(){selectedProductIds.clear();renderShopping()}
function moveSelectedProducts(copy){const ids=[...selectedProductIds];if(!ids.length){alert('Selecciona al menos un producto.');return}const target=document.querySelector('#targetList')?.value;if(!target)return;const allPendingLidl=store==='Lidl'&&!showBought&&ids.length===products.filter(p=>(p.lists||[]).includes('Lidl')&&!p.bought).length;if(!copy&&allPendingLidl&&!confirm('Vas a mover todos los productos pendientes de Lidl. ¿Continuar?'))return;for(const id of ids){const p=products.find(x=>x.id===id);if(!p)continue;if(copy){products.push({...p,id:Date.now()+Math.floor(Math.random()*100000),store:target==='General'?(p.store||'Lidl'):target,lists:[target],bought:false})}else{p.lists=(p.lists||[]).filter(l=>l!==store);if(!p.lists.length){p.lists=[target]}else if(!p.lists.includes(target)){p.lists.push(target)}if(target!=='General')p.store=target;if(!p.lists.length)products=products.filter(x=>x.id!==id)}}selectedProductIds.clear();save();renderShopping()}
function toggleProduct(id){let p=products.find(p=>p.id===id);if(p)p.bought=!p.bought;selectedProductIds.delete(id);save();renderShopping()}function deleteProduct(id){const p=products.find(p=>p.id===id);if(p){p.lists=(p.lists||[]).filter(l=>l!==store);if(!p.lists.length)products=products.filter(x=>x.id!==id)}selectedProductIds.delete(id);save();renderShopping()}
function renderCalendar(seed=''){screen='Calendario';const future=events.filter(e=>e.date>=today()).sort((a,b)=>((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||'')));document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()" aria-label="Volver al inicio">‹</button><h1>📅 Calendario</h1></div><div class="dashboard-lead"><div class="eyebrow">Tu agenda</div><h2>${future.length?`${future.length} eventos próximos`:'Espacio para lo importante'}</h2><p>Consulta tus próximos compromisos, con hora, ubicación y detalles.</p><div class="stat-pills"><span>${future.filter(e=>e.date===today()).length} hoy</span><span>${future.filter(e=>e.date===tomorrow()).length} mañana</span></div></div><div class="module-toolbar"><span class="item-meta">PRÓXIMAMENTE</span><button class="primary" type="button" onclick="toggleAddForm()">＋ Nuevo evento</button></div><section class="panel hidden" id="addPanel"><form id="eventForm"><div class="field"><label>Nombre</label><input id="eventTitle" placeholder="Ej. Cita médica" value="${esc(seed)}" required></div><div class="field"><label>Fecha</label><input id="eventDate" type="date" value="${today()}" required></div><div class="field"><label>Hora</label><input id="eventTime" type="time"></div><div class="field"><label>Duración</label><select id="eventDuration"><option value="30">30 minutos</option><option value="60" selected>1 hora</option><option value="90">1 h 30 min</option><option value="120">2 horas</option><option value="240">Medio día</option><option value="480">Día completo</option></select></div><div class="field"><label>Ubicación</label><input id="eventLocation" placeholder="Dirección, centro médico, restaurante…"></div><div class="field"><label>Personas (opcional)</label><input id="eventPeople" placeholder="Con quién quedas"></div><div class="field"><label>Notas (opcional)</label><textarea id="eventNotes" placeholder="Información útil, reserva, preparación…"></textarea></div><button class="primary">Guardar evento</button></form></section><section class="panel"><div id="calendarList">${calendarRows()}</div></section><p class="hint">Los eventos se guardan en el calendario interno de Oihane. La sincronización automática con Apple Calendar requiere una futura versión nativa.</p>`;document.querySelector('#eventForm').onsubmit=e=>{e.preventDefault();events.push({id:Date.now(),title:document.querySelector('#eventTitle').value.trim(),date:document.querySelector('#eventDate').value,time:document.querySelector('#eventTime').value,duration:document.querySelector('#eventDuration').value,location:document.querySelector('#eventLocation').value.trim(),people:document.querySelector('#eventPeople').value.trim(),notes:document.querySelector('#eventNotes').value.trim()});save();renderCalendar()}}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

async function compressPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=720,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.58))};img.src=reader.result};reader.readAsDataURL(file)})}
function filterExtra(section,button){document.querySelectorAll('.subtabs button').forEach(b=>b.classList.remove('active'));button.classList.add('active');renderExtraList(extraCurrent,section)}
function renderExtraList(name,section){const items=extraItems(name).filter(i=>sectionFor(name,i)===section&&!(name==='Cultura'&&section==='HISTORIAL')&&!(name==='Hogar'&&activeRoom&&i.room!==activeRoom)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));const list=document.querySelector('#extraList');if(!list)return;const heading=document.querySelector('#extraSectionTitle');if(heading)heading.textContent=name==='Hogar'&&activeRoom?`${activeRoom} · ${section}`:section;const count=document.querySelector('#extraCount');if(count)count.textContent=items.length;list.innerHTML=items.length?items.map(i=>`<div class="item">${i.photo?`<img class="item-photo" src="${i.photo}" alt="${esc(i.title)}">`:''}<div class="item-main"><div class="item-title">${esc(i.title)}</div><div class="item-meta">${esc(i.status)}${i.date?' · '+fmt(i.date):''}${i.room?' · '+esc(i.room):''}${i.kind?' · '+esc(i.kind):''}${i.person?' · Para '+esc(i.person):''}${i.location?' · 📍 '+esc(i.location):''}</div>${i.frequency?`<div class="item-meta">Riego cada ${esc(i.frequency)} días${i.lastWatered?' · Último riego '+fmt(i.lastWatered):''}</div>`:''}${i.light?`<div class="item-meta">☀️ ${esc(i.light)}</div>`:''}${i.ingredients?`<div class="item-meta">Ingredientes: ${esc(i.ingredients)}</div>`:''}${i.creator?`<div class="item-meta">${esc(i.creator)}</div>`:''}${i.price?`<div class="item-meta">Objetivo: ${esc(i.price)} €</div>`:''}${i.notes?`<div class="item-meta">${esc(i.notes)}</div>`:''}${i.link?`<div class="item-meta"><a href="${esc(i.link)}" target="_blank" rel="noopener">Abrir enlace ↗</a></div>`:''}${i.steps?`<details><summary>Ver preparación</summary><div class="item-meta">${esc(i.steps)}</div></details>`:''}</div><div class="item-actions"><button class="small-action" onclick="cycleExtraStatus('${name}',${i.id},'${section}')">Estado ↻</button><button class="delete" aria-label="Eliminar" onclick="deleteExtra('${name}',${i.id},'${section}')">×</button></div></div>`).join(''):'<div class="empty-list">Todavía no hay elementos aquí. Puedes añadir el primero arriba.</div>'}
function cycleExtraStatus(name,id,section){const c=extraConfig[name],items=extraItems(name),item=items.find(x=>x.id===id);if(!item)return;const order=name==='Wishlist'?['Idea','Buscando','Elegido','Comprado']:name==='Regalos'?['Idea','Buscando','Elegido','Comprado','Pedido','En camino','Entregado']:name==='Plantas'?['Bien','En observación','Necesita atención']:name==='Recetas'?['Quiero probar','Quiero aprender','Cocinada','Habitual']:name==='Viajes'?['Quiero ir','Próximamente','Viaje realizado']:name==='Planes'?['Sin fecha','Próximo','Realizado']:name==='Cultura'?['Pendiente','Leído / visto','Quiero ver en persona']:name==='Hogar'?['Cosas fijas que comprar','Inspiración','Opciones']:c.status;let idx=order.indexOf(item.status);item.status=order[(idx+1+order.length)%order.length]||order[0];saveExtra(name,items);renderExtraList(name,section)}
function deleteExtra(name,id,section){if(!confirm('¿Quieres eliminar este elemento?'))return;saveExtra(name,extraItems(name).filter(i=>i.id!==id));renderExtraList(name,section)}
