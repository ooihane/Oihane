<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#30372c;--muted:#777b70;--olive:#7d8764;--line:#e8e2d5;--accent:#e8eddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:680px;margin:auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.date{font-size:13px;color:var(--muted)}h1{font-size:29px;margin:8px 0 18px;letter-spacing:-.04em}.assistant{display:flex;gap:10px;align-items:center;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:22px}.assistant .bubble{font-size:22px}.assistant input{background:transparent;border:0;outline:0;min-width:0;flex:1;color:var(--ink)}.assistant button{background:var(--accent);border-radius:12px;padding:9px 11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.section-head h2{font-size:12px;letter-spacing:.12em;margin:0;color:var(--muted)}.section-head button{background:none;color:var(--olive);font-size:13px}.upcoming{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:23px}.empty{font-size:14px;color:var(--muted);padding:6px 0}.event{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event-date{font-size:11px;color:var(--olive);min-width:50px;font-weight:700;text-transform:uppercase}.event-title{font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.module{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:102px;padding:15px 8px;text-align:center;color:var(--ink);box-shadow:0 2px 4px #3b392b05}.module:active{transform:scale(.98)}.emoji{font-size:27px;display:block;margin-bottom:9px}.module span:last-child{font-size:12px;font-weight:600}.screen-head{display:flex;align-items:center;gap:12px;margin:4px 0 22px}.back{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;color:var(--ink)}.screen-head h1{margin:0;font-size:25px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px}.panel h3{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 13px}.add-row{display:flex;gap:8px;margin-bottom:13px}.add-row input,.add-row select,.field input,.field select{min-width:0;flex:1;border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:12px;color:var(--ink)}.primary{background:var(--olive);color:white;padding:12px 15px;border-radius:12px;font-weight:600}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.subtabs button{background:#efecdf;color:var(--muted);border-radius:12px;padding:9px 12px;font-size:13px}.subtabs button.active{background:var(--accent);color:var(--ink);font-weight:700}.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.category-heading{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--olive);text-transform:uppercase;padding:13px 0 2px;border-bottom:1px solid var(--line)}.item input[type=checkbox]{accent-color:var(--olive);width:18px;height:18px}.check-label{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;font-size:9px;color:var(--muted)}.check-label input{margin:0}.item-main{flex:1;min-width:0}.item-title{font-size:14px;overflow-wrap:anywhere}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}.done .item-title{text-decoration:line-through;color:var(--muted)}.delete{background:transparent;color:#a09c90;font-size:18px;padding:4px 7px}.empty-list{color:var(--muted);font-size:14px;padding:10px 0}.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}.field textarea{min-width:0;width:100%;border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:12px;color:var(--ink);font:inherit;min-height:76px}.photo-preview{width:78px;height:78px;object-fit:cover;border-radius:13px;border:1px solid var(--line);flex-shrink:0}
.dashboard-lead{background:linear-gradient(135deg,#e9eddf,#fdfbf5 78%);border:1px solid var(--line);border-radius:20px;padding:19px;margin:0 0 15px}.dashboard-lead h2{font-size:22px;line-height:1.15;letter-spacing:-.035em;margin:8px 0}.dashboard-lead p{font-size:13px;line-height:1.5;color:var(--muted);margin:0;max-width:38ch}.stat-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.stat-pills span{background:#fffdf8;border:1px solid #e8e2d5;border-radius:999px;padding:6px 9px;font-size:11px;color:var(--ink)}.module-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}.module-toolbar .subtabs{margin:0;flex:1}.module-toolbar .primary{white-space:nowrap;font-size:12px;padding:10px 12px}.room-grid,.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.room-chip,.setting-tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;color:var(--ink);font-size:12px;line-height:1.35}.room-chip small,.setting-tile small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.setting-tile b{font-size:12px}.room-chip:active{background:var(--accent)}.panel .section-head h2{font-size:11px}.module-toolbar .subtabs button{padding:8px 10px}.dashboard-lead+.module-toolbar{margin-top:17px}
.item-actions{display:flex;gap:5px;align-items:center}.small-action{background:var(--accent);color:var(--ink);border-radius:9px;padding:7px 9px;font-size:11px}.item-photo{width:56px;height:56px;object-fit:cover;border-radius:12px;flex-shrink:0}.field input[type=file]{padding:8px;background:transparent}.hidden{display:none!important}.field input[type=checkbox]{width:auto;flex:0}.field .inline-check{display:flex;align-items:center;gap:9px}.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=url]{width:100%}.room-chip.active{background:var(--accent);border-color:var(--olive)}.integration-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.integration-actions button{background:var(--accent);color:var(--ink);padding:10px 12px;border-radius:11px;font-size:12px}.status-note{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0}.item-link{display:inline-block;margin-top:6px;font-size:12px;color:var(--olive)}.priority-high{color:#9b4a37;font-weight:700}.task-controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.task-controls button{border-radius:10px;padding:8px 10px;background:#efecdf;color:var(--ink)}@media(min-width:500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.module{min-height:112px}}
</style></head><body><main class="app" id="app"></main>
<script>
const modules=[['🛒','Compras'],['📅','Calendario'],['❤️','Wishlist'],['🎁','Regalos'],['🏡','Hogar'],['🌱','Plantas'],['🍝','Recetas'],['📖','Estudio'],['✈️','Viajes'],['🎨','Cultura'],['🗓️','Planes'],['📋','Tareas'],['⚙️','Más']];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const readStore=(key)=>{try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}};const fmt=d=>{if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})};
let tasks=readStore('oihane_tasks'), products=readStore('oihane_products'), events=readStore('oihane_events');let screen='home',store='Lidl',showBought=false,calendarView='all';let selectedProductIds=new Set();const productCategories=['Fruta y verdura','Carne y pescado','Lácteos y huevos','Panadería','Despensa','Congelados','Bebidas','Limpieza','Higiene','Otros'];
const save=()=>{localStorage.setItem('oihane_tasks',JSON.stringify(tasks));localStorage.setItem('oihane_products',JSON.stringify(products));localStorage.setItem('oihane_events',JSON.stringify(events))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){screen='home';let d=new Date(), greeting=d.getHours()<12?'Buenos días':d.getHours()<20?'Buenas tardes':'Buenas noches';let upcoming=events.filter(e=>e.date&&e.date>=today()&&e.date<=tomorrow()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);document.querySelector('#app').innerHTML=`<div class="top"><div class="eyebrow">Tu espacio personal</div><div class="date">${d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}</div></div><h1>${greeting}, Oihane 👋</h1><form class="assistant" id="assistant"><span class="bubble">✳️</span><input id="ask" placeholder="¿En qué te ayudo?" autocomplete="off"><button type="button" aria-label="Dictar por voz" onclick="startVoiceInput()">🎙️</button><button aria-label="Enviar">↗</button></form><div class="section-head"><h2>PRÓXIMAMENTE</h2><button onclick="openModule('Calendario')">Ver calendario</button></div><section class="upcoming">${upcoming.length?upcoming.map(e=>`<div class="event"><div class="event-date">${e.date===today()?'HOY':e.date===tomorrow()?'MAÑANA':fmt(e.date)}${e.time?'<br>'+esc(e.time):''}</div><div class="event-title">${esc(e.title)}${e.location?`<div class="item-meta">📍 ${esc(e.location)}</div>`:''}</div></div>`).join(''):'<div class="empty">De momento, tu agenda está tranquila 🌿</div>'}</section><div class="section-head"><h2>TUS ESPACIOS</h2></div><div class="grid">${modules.map(m=>`<button class="module" onclick="openModule('${m[1]}')"><span class="emoji">${m[0]}</span><span>${m[1]}</span></button>`).join('')}</div>`;document.querySelector('#assistant').onsubmit=e=>{e.preventDefault();let q=document.querySelector('#ask').value.trim();if(!q)return;if(/^he regado (.+)/i.test(q)){const n=q.replace(/^he regado /i,'').trim().toLowerCase(),items=extraItems('Plantas'),p=items.find(x=>x.title.toLowerCase().includes(n));if(p){p.lastWatered=today();p.date=p.frequency?nextPlantDate(p):'';p.status='Bien';saveExtra('Plantas',items);alert('He actualizado el último riego de '+p.title+'.')}else{openModule('Plantas',q)}}else if(/compra|añade|añadir|leche|supermercado|necesito/i.test(q)){openModule('Compras',q)}else if(/^he limpiado /i.test(q)){const target=q.replace(/^he limpiado /i,'').trim().toLowerCase(),found=tasks.find(t=>!t.done&&t.title.toLowerCase().includes(target));if(found){toggleTask(found.id);alert('Tarea completada: '+found.title)}else openModule('Tareas','Limpiar '+q.replace(/^he limpiado /i,''))}else if(/tarea|pendiente|limpiar|estudiar/i.test(q)){openModule('Tareas',q)}else if(/calendario|evento|cita|reunión/i.test(q)){openModule('Calendario',q)}else if(/receta|cocinar|ingredientes/i.test(q)){openModule('Recetas',q)}else if(/planta|monstera|regar/i.test(q)){openModule('Plantas',q)}else if(/viaje|viajar|destino/i.test(q)){openModule('Viajes',q)}else if(/regalo/i.test(q)){openModule('Regalos',q)}else if(/plan/i.test(q)){openModule('Planes',q)}else{alert('Puedo llevarte al módulo adecuado, pero este asistente local todavía no interpreta órdenes complejas ni usa IA/voz avanzada. Elige un módulo para guardar la información.')}}}
function exportBackup(){const data={tasks,products,events,extras:{}};Object.keys(extraConfig).forEach(n=>data.extras[extraConfig[n].key]=extraItems(n));const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oihane-copia-'+today()+'.json';a.click();URL.revokeObjectURL(url)}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='application/json';input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());if(!confirm('Restaurar esta copia puede sustituir los datos actuales. ¿Continuar?'))return;if(Array.isArray(data.tasks))tasks=data.tasks;if(Array.isArray(data.products))products=data.products;if(Array.isArray(data.events))events=data.events;save();if(data.extras)Object.entries(data.extras).forEach(([key,value])=>{if(Array.isArray(value))localStorage.setItem('oihane_'+key,JSON.stringify(value))});home();alert('Copia restaurada.')}catch{alert('No se ha podido leer la copia.')}};input.click()}
function openModule(name,seed=''){screen=name; if(name==='Tareas')renderTasks(seed);else if(name==='Compras')renderShopping(seed);else if(name==='Calendario')renderCalendar(seed);else renderExtraModule(name,seed)}
function renderTasks(seed=''){screen='Tareas';const pending=tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()" aria-label="Volver al inicio">‹</button><h1>📋 Tareas</h1></div><div class="dashboard-lead"><div class="eyebrow">Una lista, sin ruido</div><h2>${pending.length?`${pending.length} cosas por resolver`:'Todo al día ✨'}</h2><p>Ordenadas por fecha. Las tareas repetitivas vuelven a aparecer cuando toque.</p><div class="stat-pills"><span>${pending.filter(t=>t.date&&t.date<=today()).length} para hoy o atrasadas</span><span>${tasks.filter(t=>t.done).length} completadas</span></div></div><div class="module-toolbar"><span class="item-meta">PENDIENTES</span><button class="primary" type="button" onclick="toggleAddForm()">＋ Añadir tarea</button></div><section class="panel hidden" id="addPanel"><form id="taskForm"><div class="field"><label>Tarea</label><input id="taskInput" placeholder="¿Qué tienes que hacer?" value="${esc(seed)}" required></div><div class="field"><label>Fecha (opcional)</label><input id="taskDate" type="date"></div><div class="field"><label>Repetición</label><select id="taskRepeat"><option value="">Sin repetición</option><option>Diaria</option><option>Cada 2 días</option><option>Cada 3 días</option><option>Cada 4 días</option><option>Cada 5 días</option><option>Cada 6 días</option><option>Semanal</option><option>Cada 2 semanas</option><option>Cada 3 semanas</option><option>Cada 4 semanas</option><option>Mensual</option><option>Cada 2 meses</option><option>Cada 3 meses</option><option>Cada 6 meses</option><option>Anual</option><option>Días concretos</option><option>Personalizada</option></select></div><div class="field"><label>Intervalo personalizado (días)</label><input id="taskIntervalDays" type="number" min="1" max="365" value="7"></div><div class="field"><label>Días de la semana (para días concretos)</label><div class="subtabs" id="taskWeekdays">${["L","M","X","J","V","S","D"].map((d,i)=>`<label class="check-label"><input type="checkbox" value="${i+1}">${d}</label>`).join("")}</div></div><div class="field"><label>Importancia</label><select id="taskImportance"><option value="2">Normal</option><option value="3">Alta</option><option value="1">Baja</option></select></div><div class="field"><label>Categoría</label><select id="taskCategory"><option>Personal</option><option>Hogar</option><option>Trabajo</option><option>Salud</option><option>Estudio</option><option>Recados</option></select></div><div class="field"><label>Lugar (opcional)</label><input id="taskLocation" placeholder="Ej. supermercado, hospital…"></div><div class="field"><label>Contexto / vínculo (opcional)</label><input id="taskContext" placeholder="Ej. cuando esté en casa, compra, planta…"></div><div class="field"><label class="inline-check"><input id="taskNotify" type="checkbox"> Recordarme (requiere permiso del navegador)</label></div><div class="field"><label class="inline-check"><input id="taskShared" type="checkbox"> Compartida</label></div><button class="primary">Guardar tarea</button></form></section><section class="panel"><div id="taskList">${taskRows()}</div><div class="section-head" style="margin-top:14px"><h2>COMPLETADAS RECIENTEMENTE</h2><button onclick="showCompletedTasks()">Ver historial</button></div><div id="completedTasks"></div></section>`;document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),title:document.querySelector('#taskInput').value.trim(),date:document.querySelector('#taskDate').value||'',repeat:document.querySelector('#taskRepeat').value,intervalDays:Number(document.querySelector('#taskIntervalDays').value||7),weekdays:[...document.querySelectorAll('#taskWeekdays input:checked')].map(x=>Number(x.value)),category:document.querySelector('#taskCategory').value,location:document.querySelector('#taskLocation').value.trim(),context:document.querySelector('#taskContext').value.trim(),importance:Number(document.querySelector('#taskImportance').value||2),notify:document.querySelector('#taskNotify').checked,shared:document.querySelector('#taskShared').checked,done:false,created:today(),completedAt:'',lastCompleted:''});save();renderTasks()}}

function taskPriority(t){const due=t.date||'9999-12-31';const overdue=due<today()?100:due===today()?70:due===tomorrow()?45:0;return overdue+(Number(t.importance||2)*10)+(t.repeat?3:0)}
function taskRows(){let list=tasks.filter(t=>!t.done).sort((a,b)=>taskPriority(b)-taskPriority(a)||(a.date||'9999').localeCompare(b.date||'9999')||(a.location||'').localeCompare(b.location||''));return list.length?list.map(t=>`<div class="item"><input aria-label="Completar ${esc(t.title)}" type="checkbox" onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)} ${Number(t.importance)===3?'<span class="priority-high">· Alta</span>':''}</div><div class="item-meta">${t.date?fmt(t.date):'Sin fecha'}${t.repeat?' · '+esc(t.repeat):''}${t.category?' · '+esc(t.category):''}${t.location?' · 📍 '+esc(t.location):''}${t.context?' · '+esc(t.context):''}${t.notify?' · 🔔':''}${t.shared?' · Compartida':''}${t.lastCompleted?' · Última vez '+fmt(t.lastCompleted):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">No tienes tareas pendientes ✨</div>'}
function addMonthsClamped(date,months){const day=date.getDate();date.setDate(1);date.setMonth(date.getMonth()+months);const last=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();date.setDate(Math.min(day,last));return date}
function nextRepeatDate(t){let d=new Date((t.date||today())+'T12:00:00'),r=t.repeat||'';if(!r)return '';const m=r.match(/Cada (\d+) días?/i);if(m)d.setDate(d.getDate()+Number(m[1]));else if(r==='Diaria')d.setDate(d.getDate()+1);else if(r==='Semanal')d.setDate(d.getDate()+7);else if(r==='Cada 2 semanas')d.setDate(d.getDate()+14);else if(r==='Cada 3 semanas')d.setDate(d.getDate()+21);else if(r==='Cada 4 semanas')d.setDate(d.getDate()+28);else if(r==='Mensual')addMonthsClamped(d,1);else if(r==='Cada 2 meses')addMonthsClamped(d,2);else if(r==='Cada 3 meses')addMonthsClamped(d,3);else if(r==='Cada 6 meses')addMonthsClamped(d,6);else if(r==='Anual')addMonthsClamped(d,12);else if(r==='Días concretos'&&Array.isArray(t.weekdays)&&t.weekdays.length){for(let i=1;i<=7;i++){const c=new Date(d);c.setDate(c.getDate()+i);if(t.weekdays.includes(c.getDay()||7)){d=c;break}}}else if(r==='Personalizada')d.setDate(d.getDate()+Number(t.intervalDays||7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toggleTask(id){let t=tasks.find(t=>t.id===id);if(!t)return;if(!t.done){t.done=true;t.completedAt=today();t.lastCompleted=today();if(t.repeat){const next=nextRepeatDate(t);tasks.push({...t,id:Date.now()+Math.floor(Math.random()*999),date:next,done:false,created:today(),completedAt:'',lastCompleted:today()})}}else{t.done=false;t.completedAt=''}save();renderTasks()}
function deleteTask(id){if(!confirm('¿Eliminar esta tarea y su recurrencia actual?'))return;tasks=tasks.filter(t=>t.id!==id);save();renderTasks()}
function showCompletedTasks(){let el=document.querySelector('#completedTasks');let done=tasks.filter(t=>t.done);el.innerHTML=done.length?done.map(t=>`<div class="item done"><input type="checkbox" checked onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${t.completedAt?'Completada el '+fmt(t.completedAt):'Completada'}${t.lastCompleted?' · Última vez '+fmt(t.lastCompleted):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">Todavía no hay tareas completadas.</div>'}
function migrateProducts(){let changed=false;products=products.map(p=>{if(!Array.isArray(p.lists)){changed=true;return {...p,category:p.category||'Otros',store:p.store||'Lidl',lists:[...new Set(['General',p.store||'Lidl'])]}}let lists=[...new Set(p.lists||[])];if(!p.category){changed=true;return {...p,category:'Otros',store:p.store||'Lidl',lists}}return p});if(changed)save()}
migrateProducts();
function renderShopping(seed=''){screen='Compras';document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()">‹</button><h1>🛒 Compras</h1></div><div class="subtabs">${['General','Lidl','Eroski','Mercadona'].map(s=>`<button class="${store===s?'active':''}" onclick="setStore('${s}')">${s}</button>`).join('')}</div><section class="panel"><h3>${store==='General'?'LISTA GENERAL':'LISTA DE '+store.toUpperCase()}</h3><form class="add-row" id="productForm"><input id="productInput" placeholder="Añadir producto…" value="${esc(seed)}" required><button class="primary">Añadir</button></form><div class="field"><label>Categoría</label><select id="productCategory">${productCategories.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="subtabs"><button class="${!showBought?'active':''}" onclick="setBought(false)">Pendientes</button><button class="${showBought?'active':''}" onclick="setBought(true)">Comprados</button></div><div>${productRows()}</div></section><p class="hint">La lista General reúne los productos pendientes; cada producto también pertenece a su tienda habitual. Los nuevos se asignan a Lidl salvo que elijas otra tienda. Los datos se guardan en este dispositivo.</p>`;document.querySelector('#productForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#productInput').value.trim();if(!title)return;const assignedStore=store==='General'?'Lidl':store;products.push({id:Date.now(),title,store:assignedStore,lists:[...new Set(['General',assignedStore])],category:document.querySelector('#productCategory').value,bought:false,created:today()});selectedProductIds.clear();save();renderShopping()}}
function setStore(s){store=s;showBought=false;selectedProductIds.clear();renderShopping()}function setBought(b){showBought=b;selectedProductIds.clear();renderShopping()}
function toggleSelectedProduct(id,checked){if(checked)selectedProductIds.add(id);else selectedProductIds.delete(id);const bar=document.querySelector('#bulkActions');if(bar)bar.classList.toggle('hidden',selectedProductIds.size===0);const count=document.querySelector('#selectedCount');if(count)count.textContent=selectedProductIds.size}
function productRows(){let arr=products.filter(p=>(p.lists||[]).includes(store)&&p.bought===showBought);if(!arr.length)return '<div class="empty-list">'+(showBought?'Todavía no has comprado nada de esta lista.':'Tu lista está vacía. Añade lo que necesites.')+'</div>';const row=p=>`<div class="item ${p.bought?'done':''}"><label class="check-label"><input aria-label="Marcar ${esc(p.title)} como comprado" type="checkbox" ${p.bought?'checked':''} onchange="toggleProduct(${p.id})">${p.bought?'Recuperar':'Comprado'}</label><label class="check-label"><input aria-label="Seleccionar ${esc(p.title)} para mover o copiar" type="checkbox" ${selectedProductIds.has(p.id)?'checked':''} onchange="toggleSelectedProduct(${p.id},this.checked)">Elegir</label><div class="item-main"><div class="item-title">${esc(p.title)}</div>${store==='General'?`<div class="item-meta">${esc(p.category||'Otros')} · ${esc(p.store||'Lidl')}</div>`:''}${p.sourceRecipe?`<div class="item-meta">Receta: ${esc(p.sourceRecipe)}</div>`:''}${p.sourceHomeTitle?`<div class="item-meta">Hogar: ${esc(p.sourceHomeTitle)}</div>`:''}</div><button class="delete" aria-label="Quitar ${esc(p.title)} de esta lista" onclick="deleteProduct(${p.id})">×</button></div>`;let body='';if(store==='General'&&!showBought){const order=[...productCategories];for(const cat of order){const group=arr.filter(p=>(p.category||'Otros')===cat);if(group.length)body+=`<div class="category-heading">${esc(cat)}</div>${group.map(row).join('')}`}const other=arr.filter(p=>!order.includes(p.category||'Otros'));if(other.length)body+=`<div class="category-heading">Otros</div>${other.map(row).join('')}`}else body=arr.map(row).join('');return `${body}<div class="panel ${selectedProductIds.size?'':'hidden'}" id="bulkActions" style="padding:12px;margin-top:12px"><div class="item-meta"><span id="selectedCount">${selectedProductIds.size}</span> seleccionados</div><div class="field"><label>Mover o copiar a</label><select id="targetList">${['General','Lidl','Eroski','Mercadona'].filter(x=>x!==store).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="add-row"><button class="primary" type="button" onclick="moveSelectedProducts(false)">Mover</button><button class="primary" type="button" onclick="moveSelectedProducts(true)">Copiar</button><button type="button" onclick="clearProductSelection()" style="background:#efecdf;border-radius:12px;padding:10px">Cancelar</button></div><div class="hint">Marca la segunda casilla de cada producto para seleccionarlo. La primera sirve para marcarlo como comprado.</div></div>`}
function clearProductSelection(){selectedProductIds.clear();renderShopping()}
function moveSelectedProducts(copy){const ids=[...selectedProductIds];if(!ids.length){alert('Selecciona al menos un producto.');return}const target=document.querySelector('#targetList')?.value;if(!target)return;const allPendingLidl=store==='Lidl'&&!showBought&&ids.length===products.filter(p=>(p.lists||[]).includes('Lidl')&&!p.bought).length;if(!copy&&allPendingLidl&&!confirm('Vas a mover todos los productos pendientes de Lidl. ¿Continuar?'))return;for(const id of ids){const p=products.find(x=>x.id===id);if(!p)continue;if(copy){const duplicate={...p,id:Date.now()+Math.floor(Math.random()*100000),store:target==='General'?(p.store||'Lidl'):target,lists:[target],bought:false};products.push(duplicate)}else{p.lists=(p.lists||[]).filter(l=>l!==store);if(!p.lists.includes(target))p.lists.push(target);if(target!=='General')p.store=target;if(!p.lists.length)products=products.filter(x=>x.id!==id)}}selectedProductIds.clear();save();renderShopping()}
function toggleProduct(id){let p=products.find(p=>p.id===id);if(p){p.bought=!p.bought;if(p.sourceHomeId){const homeItems=extraItems('Hogar'),h=homeItems.find(x=>x.id===p.sourceHomeId);if(h){h.purchased=!!p.bought;saveExtra('Hogar',homeItems)}}}selectedProductIds.delete(id);save();renderShopping()}function deleteProduct(id){const p=products.find(p=>p.id===id);if(p){p.lists=(p.lists||[]).filter(l=>l!==store);if(!p.lists.length)products=products.filter(x=>x.id!==id)}selectedProductIds.delete(id);save();renderShopping()}
function renderCalendar(seed=''){screen='Calendario';const future=events.filter(e=>e.date>=today()).sort((a,b)=>((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||'')));document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()" aria-label="Volver al inicio">‹</button><h1>📅 Calendario</h1></div><div class="dashboard-lead"><div class="eyebrow">Tu agenda</div><h2>${future.length?`${future.length} eventos próximos`:'Espacio para lo importante'}</h2><p>Consulta tus próximos compromisos, con hora, ubicación y detalles.</p><div class="stat-pills"><span>${future.filter(e=>e.date===today()).length} hoy</span><span>${future.filter(e=>e.date===tomorrow()).length} mañana</span></div></div><div class="module-toolbar"><div class="subtabs"><button class="active" onclick="setCalendarView('day',this)">Día</button><button onclick="setCalendarView('week',this)">Semana</button><button onclick="setCalendarView('month',this)">Mes</button><button onclick="setCalendarView('all',this)">Todos</button></div><button class="primary" type="button" onclick="toggleAddForm()">＋ Nuevo evento</button></div><section class="panel hidden" id="addPanel"><form id="eventForm"><div class="field"><label>Nombre</label><input id="eventTitle" placeholder="Ej. Cita médica" value="${esc(seed)}" required></div><div class="field"><label>Fecha</label><input id="eventDate" type="date" value="${today()}" required></div><div class="field"><label>Hora</label><input id="eventTime" type="time"></div><div class="field"><label>Duración</label><select id="eventDuration"><option value="30">30 minutos</option><option value="60" selected>1 hora</option><option value="90">1 h 30 min</option><option value="120">2 horas</option><option value="240">Medio día</option><option value="480">Día completo</option></select></div><div class="field"><label>Ubicación</label><input id="eventLocation" placeholder="Dirección, centro médico, restaurante…"></div><div class="field"><label>Personas (opcional)</label><input id="eventPeople" placeholder="Con quién quedas"></div><div class="field"><label>Notas (opcional)</label><textarea id="eventNotes" placeholder="Información útil, reserva, preparación…"></textarea></div><div class="field"><label class="inline-check"><input id="eventNotify" type="checkbox"> Aviso (el navegador debe permitir notificaciones)</label></div><div class="field"><label>Tiempo para salir antes (minutos)</label><input id="eventDeparture" type="number" min="0" step="5" placeholder="Ej. 30"></div><button class="primary">Guardar evento</button></form></section><section class="panel"><div id="calendarList">${calendarRows()}</div></section><p class="hint">Los eventos se guardan en el calendario interno de Oihane. La sincronización automática con Apple Calendar requiere una futura versión nativa.</p>`;document.querySelector('#eventForm').onsubmit=e=>{e.preventDefault();events.push({id:Date.now(),title:document.querySelector('#eventTitle').value.trim(),date:document.querySelector('#eventDate').value,time:document.querySelector('#eventTime').value,duration:document.querySelector('#eventDuration').value,location:document.querySelector('#eventLocation').value.trim(),people:document.querySelector('#eventPeople').value.trim(),notes:document.querySelector('#eventNotes').value.trim(),notify:document.querySelector('#eventNotify').checked,departureMinutes:document.querySelector('#eventDeparture').value||''});save();renderCalendar()}}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function setCalendarView(view,button){calendarView=view;document.querySelectorAll('.module-toolbar .subtabs button').forEach(b=>b.classList.remove('active'));button.classList.add('active');const list=document.querySelector('#calendarList');if(list)list.innerHTML=calendarRows()}
function calendarRows(){let base=events.slice();const start=new Date(today()+'T12:00:00'),end=new Date(start);if(calendarView==='day')end.setDate(end.getDate());else if(calendarView==='week'){const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);end.setTime(start.getTime());end.setDate(start.getDate()+6)}else if(calendarView==='month'){start.setDate(1);end.setMonth(end.getMonth()+1);end.setDate(0)}if(calendarView!=='all'){const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;base=base.filter(e=>e.date>=iso(start)&&e.date<=iso(end))}let arr=base.sort((a,b)=>((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||'')));return arr.length?arr.map(e=>`<div class="item"><div class="event-date">${e.date===today()?'HOY':e.date===tomorrow()?'MAÑANA':fmt(e.date)}${e.time?'<br>'+esc(e.time):''}</div><div class="item-main"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${e.location?'📍 '+esc(e.location):'Sin ubicación'}${e.duration?' · '+(e.duration>=480?'Día completo':e.duration+' min'):''}${e.people?' · '+esc(e.people):''}</div>${e.notes?`<div class="item-meta">${esc(e.notes)}</div>`:''}</div><button class="delete" onclick="deleteEvent(${e.id})">×</button></div>`).join(''):'<div class="empty-list">Todavía no hay eventos. Añade tu primera cita arriba.</div>'}function deleteEvent(id){if(!confirm('¿Eliminar este evento?'))return;events=events.filter(e=>e.id!==id);save();renderCalendar()}

async function compressPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=720,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.58))};img.src=reader.result};reader.readAsDataURL(file)})}
function filterExtra(section,button){document.querySelectorAll('.subtabs button').forEach(b=>b.classList.remove('active'));button.classList.add('active');renderExtraList(extraCurrent,section)}
function renderExtraList(name,section){const items=extraItems(name).filter(i=>sectionFor(name,i)===section&&!(name==='Cultura'&&section==='HISTORIAL')&&!(name==='Hogar'&&activeRoom&&i.room!==activeRoom)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));const list=document.querySelector('#extraList');if(!list)return;const heading=document.querySelector('#extraSectionTitle');if(heading)heading.textContent=name==='Hogar'&&activeRoom?`${activeRoom} · ${section}`:section;const count=document.querySelector('#extraCount');if(count)count.textContent=items.length;list.innerHTML=items.length?items.map(i=>`<div class="item">${i.photo?`<img class="item-photo" src="${i.photo}" alt="${esc(i.title)}">`:''}<div class="item-main"><div class="item-title">${esc(i.title)}</div><div class="item-meta">${esc(i.status)}${i.date?' · '+fmt(i.date):''}${i.room?' · '+esc(i.room):''}${i.kind?' · '+esc(i.kind):''}${i.person?' · Para '+esc(i.person):''}${i.location?' · 📍 '+esc(i.location):''}</div>${i.frequency?`<div class="item-meta">Riego cada ${esc(i.frequency)} días${i.lastWatered?' · Último riego '+fmt(i.lastWatered):''}</div>`:''}${i.light?`<div class="item-meta">☀️ ${esc(i.light)}</div>`:''}${i.ingredients?`<div class="item-meta">Ingredientes: ${esc(i.ingredients)}</div>`:''}${i.creator?`<div class="item-meta">${esc(i.creator)}${i.year?' · '+esc(i.year):''}${i.rating?' · ★ '+esc(i.rating)+'/5':''}${i.artPlace?' · '+esc(i.artPlace):''}</div>`:''}${i.currentPrice?`<div class="item-meta">Precio actual: ${esc(i.currentPrice)} €${i.compare?' · '+esc(i.compare):''}</div>`:''}${i.occasionDate?`<div class="item-meta">${esc(i.occasion||'Ocasión')}: ${fmt(i.occasionDate)}${i.order?' · '+esc(i.order):''}</div>`:''}${i.endDate?`<div class="item-meta">Hasta ${fmt(i.endDate)}</div>`:''}${i.transport?`<div class="item-meta">${esc(i.transport)}</div>`:''}${i.time?`<div class="item-meta">🕒 ${esc(i.time)}${i.duration?' · '+esc(i.duration)+' min':''}</div>`:''}${i.people?`<div class="item-meta">Con ${esc(i.people)}</div>`:''}${i.booking?`<div class="item-meta">${esc(i.booking)}</div>`:''}${i.tripDetails?`<div class="item-meta">${esc(i.tripDetails)}</div>`:''}${i.program?`<div class="item-meta">${esc(i.program)}</div>`:''}${i.price?`<div class="item-meta">Objetivo: ${esc(i.price)} €</div>`:''}${i.purchased?`<div class="item-meta">✓ Compra completada</div>`:''}${i.notes?`<div class="item-meta">${esc(i.notes)}</div>`:''}${i.link?`<div class="item-meta"><a href="${esc(i.link)}" target="_blank" rel="noopener">Abrir enlace ↗</a></div>`:''}${i.steps?`<details><summary>Ver preparación</summary><div class="item-meta">${esc(i.steps)}</div></details>`:''}</div><div class="item-actions">${name==='Plantas'?`<button class="small-action" onclick="waterPlant(${i.id})">He regado</button>`:''}${name==='Recetas'?`<button class="small-action" onclick="recipeToShopping(${i.id})">A compras</button>`:''}${name==='Wishlist'?`<button class="small-action" onclick="wishlistToGift(${i.id})">Crear regalo</button><button class="small-action" onclick="searchPrices(${i.id},'Wishlist')">Buscar precio</button>`:''}${name==='Hogar'&&i.status==='Cosas fijas que comprar'&&!i.purchased?`<button class="small-action" onclick="homeItemToShopping(${i.id})">A compras</button><button class="small-action" onclick="searchPrices(${i.id},'Hogar')">Buscar precio</button>`:''}${name==='Regalos'?`<button class="small-action" onclick="searchPrices(${i.id},'Regalos')">Buscar precio</button>`:''}${name==='Planes'&&i.date?`<button class="small-action" onclick="openLinkedEvent(${i.id},'Planes')">Ver calendario</button>`:''}${name==='Estudio'&&i.kind==='Curso'&&i.date?`<button class="small-action" onclick="openLinkedEvent(${i.id},'Estudio')">Ver calendario</button>`:''}<button class="small-action" onclick="cycleExtraStatus('${name}',${i.id},'${section}')">Estado ↻</button><button class="delete" aria-label="Eliminar" onclick="deleteExtra('${name}',${i.id},'${section}')">×</button></div></div>`).join(''):'<div class function waterPlant(id){const items=extraItems('Plantas'),p=items.find(x=>x.id===id);if(!p)return;p.lastWatered=today();p.date=p.frequency?nextPlantDate(p):'';if(p.date&&p.date<=today())p.status='Necesita atención';else p.status='Bien';saveExtra('Plantas',items);renderExtraList('Plantas',extraConfig.Plantas.sections[0])}
function nextPlantDate(p){const d=new Date((p.lastWatered||today())+'T12:00:00');d.setDate(d.getDate()+Number(p.frequency||7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function recipeToShopping(id){const r=extraItems('Recetas').find(x=>x.id===id);if(!r||!r.ingredients){alert('Añade los ingredientes de la receta primero.');return}const names=r.ingredients.split(/[\n,;]+/).map(x=>x.trim().replace(/^[-•]\s*/, '')).filter(Boolean),norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(),seen=new Set(products.map(p=>norm(p.title)));let added=0;names.forEach(title=>{if(!seen.has(norm(title))){products.push({id:Date.now()+Math.floor(Math.random()*999999),title,store:'Lidl',lists:['General','Lidl'],category:'Otros',bought:false,created:today(),sourceRecipe:r.title,sourceRecipeId:r.id});seen.add(norm(title));added++}});save();if(added)alert(`Añadidos ${added} ingredientes nuevos a General y Lidl. Los que ya estaban en la lista no se duplicaron.`);else alert('Todos los ingredientes ya estaban en la lista de compra.') }
function cycleExtraStatus(name,id,section){const c=extraConfig[name],items=extraItems(name),item=items.find(x=>x.id===id);if(!item)return;const order=name==='Wishlist'?['Idea','Buscando','Elegido','Comprado']:name==='Regalos'?['Idea','Buscando','Elegido','Comprado','Pedido','En camino','Entregado']:name==='Plantas'?['Bien','En observación','Necesita atención']:name==='Recetas'?['Esta semana','Quiero probar','Quiero aprender','Habitual','Cocinada']:name==='Viajes'?['Quiero ir','Próximamente','Viaje realizado']:name==='Planes'?['Sin fecha','Próximo','Realizado']:name==='Cultura'?['Pendiente','Leído / visto','Quiero ver en persona']:name==='Hogar'?['Cosas fijas que comprar','Inspiración','Opciones']:c.status;let idx=order.indexOf(item.status);item.status=order[(idx+1+order.length)%order.length]||order[0];saveExtra(name,items);renderExtraList(name,section)}
function deleteExtra(name,id,section){if(!confirm('¿Quieres eliminar este elemento?'))return;saveExtra(name,extraItems(name).filter(i=>i.id!==id));if(name==='Planes'||name==='Estudio'){const linked=events.filter(e=>e.sourceModule===name&&e.sourceId===id);if(linked.length&&confirm('Este elemento tiene un evento enlazado. ¿Quieres eliminar también ese evento del calendario?')){events=events.filter(e=>!(e.sourceModule===name&&e.sourceId===id));save()}}renderExtraList(name,section)}

}

function homeItemToShopping(id){const items=extraItems('Hogar'),item=items.find(x=>x.id===id);if(!item)return;const already=products.find(p=>p.sourceHomeId===item.id&&!p.bought);if(already){alert('Esta compra ya está en tu lista de compras.');openModule('Compras');return}const duplicate=products.find(p=>p.title.trim().toLowerCase()===item.title.trim().toLowerCase()&&!p.bought);if(duplicate&&!confirm('Ya existe un producto con ese nombre. ¿Quieres añadir además el vínculo con Hogar?'))return;if(duplicate){duplicate.sourceHomeId=item.id;duplicate.sourceHomeTitle=item.title}else products.push({id:Date.now(),title:item.title,store:'Lidl',lists:['General','Lidl'],category:'Otros',bought:false,created:today(),sourceHomeId:item.id,sourceHomeTitle:item.title});save();alert('Añadido a Compras (General y Lidl). Al marcarlo como comprado, Hogar lo reflejará.');openModule('Compras')}
function wishlistToGift(id){const items=extraItems('Wishlist'),w=items.find(x=>x.id===id);if(!w)return;const recipient=prompt('¿Para quién es el regalo?');if(recipient===null)return;const gifts=extraItems('Regalos');gifts.push({id:Date.now(),title:w.title,status:'Idea',date:'',notes:w.notes||'',person:recipient.trim(),occasion:'Otro',occasionDate:'',order:'',link:w.link||'',price:w.price||'',currentPrice:w.currentPrice||'',created:today(),fromWishlistId:w.id,private:recipient.trim().toLowerCase()==='rubén'});saveExtra('Regalos',gifts);alert('Idea copiada a Regalos. La Wishlist original se conserva.');openModule('Regalos')}
function searchPrices(id,moduleName){const item=extraItems(moduleName).find(x=>x.id===id);if(!item)return;const q=encodeURIComponent(item.title);const choice=prompt('Buscar precio de «'+item.title+'»:\n1 = Google Shopping\n2 = Idealo\n3 = abrir ambos (dos pestañas)\nCancelar = volver','1');if(choice===null)return;const urls=[];if(['1','3'].includes(choice))urls.push('https://www.google.com/search?tbm=shop&q='+q);if(['2','3'].includes(choice))urls.push('https://www.idealo.es/precios/MainSearchProductCategory.html?q='+q);if(!urls.length){alert('Elige 1, 2 o 3.');return}urls.forEach(url=>window.open(url,'_blank','noopener,noreferrer'));alert('Se han abierto buscadores externos. Oihane no puede leer ni verificar automáticamente los precios; anota el precio observado en el elemento.')}
function startVoiceInput(){const input=document.querySelector('#ask');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Este navegador no ofrece dictado de voz integrado. En iPhone, puedes usar el micrófono del teclado de iOS.');input?.focus();return}try{const rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{if(input)input.value=e.results[0][0].transcript};rec.onerror=()=>alert('No se pudo completar el dictado. Comprueba el permiso de micrófono y vuelve a intentarlo.');rec.start()}catch(e){alert('No se ha podido iniciar el dictado. Puedes usar el micrófono del teclado.')}}
function requestNotificationPermission(){if(!('Notification'in window)){alert('Este navegador no admite notificaciones web.');return}Notification.requestPermission().then(p=>{alert(p==='granted'?'Permiso concedido. Los avisos de esta versión se comprueban mientras Oihane permanece abierta; no son fiables con la app cerrada.': 'No se han concedido permisos de notificación.');if(p==='granted')scheduleForegroundReminderCheck()}).catch(()=>alert('No se ha podido solicitar permiso de notificaciones.'))}
let reminderTimer=null;const shownReminderKeys=new Set();function scheduleForegroundReminderCheck(){if(reminderTimer||!('Notification'in window)||Notification.permission!=='granted')return;const check=()=>{const now=new Date(),date=today(),hm=now.toTimeString().slice(0,5),nowM=now.getHours()*60+now.getMinutes();events.filter(e=>e.date===date&&e.time&&(e.notify||Number(e.departureMinutes)>0)).forEach(e=>{const parts=e.time.split(':').map(Number),eventM=parts[0]*60+parts[1],lead=Math.max(0,Number(e.departureMinutes)||0),isDeparture=lead>0&&nowM>=eventM-lead&&nowM<eventM,atEvent=!!e.notify&&nowM>=eventM;const kind=isDeparture?'salida':'evento';if(!isDeparture&&!atEvent)return;const key='e'+e.id+'-'+e.date+'-'+kind;if(shownReminderKeys.has(key))return;shownReminderKeys.add(key);try{new Notification(isDeparture?'Oihane · Hora de salir':'Oihane · '+e.title,{body:isDeparture?'Sal para llegar a tiempo: '+e.title+(e.location?' · '+e.location:''):'Evento de hoy'+(e.location?' · '+e.location:''),tag:key})}catch{}});tasks.filter(t=>t.notify&&!t.done&&(!t.date||t.date<=date)).forEach(t=>{const key='t'+t.id+'-'+date;if(shownReminderKeys.has(key))return;shownReminderKeys.add(key);try{new Notification('Oihane · Tarea pendiente',{body:t.title,tag:key})}catch{}})};check();reminderTimer=setInterval(check,60000)}
function showIntegrationStatus(){const SR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);const notif=('Notification'in window)?Notification.permission:'no disponible';alert('ESTADO DE INTEGRACIONES\n\nDictado de voz del navegador: '+(SR?'disponible (depende del navegador)':'no disponible; usa el micrófono del teclado')+'\nPermiso de notificaciones: '+notif+'\nAvisos: solo mientras Oihane esté abierta y activa.\nCalendario: exportación/importación .ics, sin sincronización bidireccional.\nPrecios: enlaces a buscadores externos; sin API ni alertas automáticas.\nSincronización entre dispositivos: no conectada.\n\nNo se envían datos a un servidor externo.')}
function escapeICS(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportCalendarICS(){if(!events.length){alert('No hay eventos que exportar todavía.');return}const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Oihane//Calendario//ES','CALSCALE:GREGORIAN'];events.forEach(e=>{if(!e.date)return;const day=e.date.replace(/-/g,'');let start=day,end=day;if(e.time){start=day+'T'+e.time.replace(':','')+'00';const d=new Date(e.date+'T'+e.time+':00');d.setMinutes(d.getMinutes()+Number(e.duration||60));end=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00'}lines.push('BEGIN:VEVENT','UID:oihane-'+e.id+'@local','DTSTAMP:'+stamp,(e.time?'DTSTART:'+start:'DTSTART;VALUE=DATE:'+start),(e.time?'DTEND:'+end:'DTEND;VALUE=DATE:'+new Date(new Date(e.date+'T12:00:00').getTime()+86400000).toISOString().slice(0,10).replace(/-/g,'')),'SUMMARY:'+escapeICS(e.title),'DESCRIPTION:'+escapeICS(e.notes||''),e.location?'LOCATION:'+escapeICS(e.location):'', 'END:VEVENT')} );lines.push('END:VCALENDAR');const blob=new Blob([lines.filter(Boolean).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oihane-calendario-'+today()+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function openCalendarImport(){const input=document.createElement('input');input.type='file';input.accept='.ics,text/calendar';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const raw=await file.text(),blocks=raw.split(/BEGIN:VEVENT/i).slice(1);let imported=0;for(const b of blocks){const block=b.split(/END:VEVENT/i)[0];const field=(name)=>{const m=block.match(new RegExp('(?:^|\\n)'+name+'(?:;[^:]*)?:([^\\r\\n]*(?:\\r?\\n[ \\t][^\\r\\n]*)*)','i'));return m?m[1].replace(/\\r?\\n[ \\t]/g,'').replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\').trim():''};let dt=field('DTSTART'),allDay=/VALUE=DATE/i.test((block.match(/DTSTART[^:]*:/i)||[''])[0]);if(!dt)continue;let date=allDay?dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8):dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8);let time=allDay?'':dt.length>=15?dt.slice(9,11)+':'+dt.slice(11,13):'';const title=field('SUMMARY')||'Evento importado';const key=title+'|'+date+'|'+time;if(events.some(e=>e.title+'|'+e.date+'|'+(e.time||'')===key))continue;events.push({id:Date.now()+imported,title,date,time,duration:'60',location:field('LOCATION'),notes:field('DESCRIPTION'),sourceModule:'ICS'});imported++}save();alert('Importados '+imported+' eventos nuevos. Los duplicados básicos se han omitido.');renderCalendar()}catch(e){alert('No se ha podido leer este archivo .ics.')}};input.click()}
function safeUpgradeSnapshot(){// No migramos ni borramos las claves existentes. Guardamos un registro de versión ligero, sin duplicar fotos ni agotar el almacenamiento.
 try{const v=document.querySelector('meta[name="oihane-version"]')?.content||'3.0.0';const previous=localStorage.getItem('oihane_last_version');if(previous!==v){localStorage.setItem('oihane_last_version',v);localStorage.setItem('oihane_last_upgrade_at',new Date().toISOString())}}catch(e){}
}

safeUpgradeSnapshot();home();if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});scheduleForegroundReminderCheck();
