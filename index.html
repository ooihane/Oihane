/* Oihane 5.4 — Orgánico moderno: salvia, crema y madera clara */
:root{--bg:#f4f0e6;--card:#fffdf8;--ink:#30392f;--muted:#777d70;--olive:#77876c;--line:#e4dfd2;--accent:#e8eddf;--wood:#d8c2a4;--wood-light:#eee2d0}
body{background:radial-gradient(ellipse at 8% 0%,#faf7ef 0%,transparent 48%),var(--bg);color:var(--ink)}
.app{max-width:720px;padding-left:17px;padding-right:17px}
h1{letter-spacing:-.045em;font-weight:720}
.assistant,.upcoming,.panel,.integration-box{border-color:var(--line);box-shadow:0 4px 18px rgba(78,69,48,.035)}
.assistant{background:linear-gradient(120deg,#fffdf8 0%,#f8f5ed 100%);border-radius:20px}
.assistant button,.small-action,.task-controls button{background:#e8eddf;color:#485642}
.primary,.integration-box .integration-actions button.primary{background:var(--olive);color:#fffdf8;box-shadow:0 2px 4px rgba(58,75,51,.12)}
.primary:active,.small-action:active,.module:active{transform:translateY(1px) scale(.99)}
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.module{min-width:0;min-height:78px;border-radius:19px;background:linear-gradient(145deg,#fffdf8 0%,#f8f4eb 100%);border-color:#e5dfd2;box-shadow:0 3px 10px rgba(75,65,44,.045);transition:transform .14s ease,box-shadow .14s ease}
.module:hover{box-shadow:0 5px 14px rgba(75,65,44,.09)}
.emoji{font-size:29px;filter:saturate(.88)}
.dashboard-lead{background:linear-gradient(135deg,#e6ebdd 0%,#f8f3e9 74%,#eee0cc 100%);border-color:#e3ddcf}
.stat-pills span{background:rgba(255,253,248,.82);border-color:#e4dfd2}
.screen-head{margin-bottom:16px}
.back{border-radius:15px;background:linear-gradient(145deg,#fffdf8,#f2ecdf);box-shadow:0 2px 8px rgba(75,65,44,.04)}
.section-cards{gap:11px;margin-top:11px}
.section-card{border-color:#e3ddcf;border-radius:19px;background:linear-gradient(145deg,#fffdf8 0%,#fcfaf4 100%);box-shadow:0 3px 12px rgba(75,65,44,.035)}
.section-card-head{padding:15px 16px;min-height:53px}
.section-card-head strong{letter-spacing:.055em;color:#465341}
.section-card-head .section-chevron{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:#edf0e6;color:#64775a}
.section-card-body{padding:0 15px 13px}
.section-card-body .empty-list{padding:9px 0 4px}
.item{border-bottom-color:#eee8dc}
.item input[type=checkbox]{accent-color:var(--olive)}
.add-row input,.add-row select,.field input,.field select,.field textarea,.integration-box input{background:#fffdf8;border-color:#e1dacb;border-radius:13px}
.subtabs button{background:#f0ece2}
.subtabs button.active,.room-chip.active{background:#e7ecde;border-color:#cbd5bf}
.category-heading,.event-date,.item-link{color:#718365}
.recipe-ingredient,.tracking-panel{background:#f4f0e6;border-color:#e5dfd2}
.oihane-toast{background:#edf1e5;border-color:#b8c5ad}
/* Los módulos se representan mediante iconos; no hay etiquetas debajo. */
.module span:last-child{display:none}
/* Equilibrada: cuatro accesos por fila y tarjetas con separación moderada. */
@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.grid{gap:7px}.module{min-height:70px}.emoji{font-size:26px}}
@media(min-width:500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.module{min-height:86px}}

<script>
const modules=[['🛒','Compras'],['📅','Calendario'],['❤️','Wishlist'],['🎁','Regalos'],['🏡','Hogar'],['🌱','Plantas'],['🍝','Recetas'],['📖','Estudio'],['✈️','Viajes'],['🎨','Cultura'],['🗓️','Planes'],['📋','Tareas'],['⚙️','Más']];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const readStore=(key)=>{try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}};const fmt=d=>{if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})};
let tasks=readStore('oihane_tasks'), products=readStore('oihane_products'), events=readStore('oihane_events');let screen='home',store='Lidl',showBought=false,calendarView='all';let selectedProductIds=new Set();const productCategories=['Fruta y verdura','Carne y pescado','Lácteos y huevos','Panadería','Despensa','Congelados','Bebidas','Limpieza','Higiene','Otros'];
const save=()=>{try{localStorage.setItem('oihane_tasks',JSON.stringify(tasks));localStorage.setItem('oihane_products',JSON.stringify(products));localStorage.setItem('oihane_events',JSON.stringify(events));queueLocalSnapshot();queueCloudSync();scheduleForegroundReminderCheck();return true}catch(e){alert('No se han podido guardar los cambios en este dispositivo. Puede faltar espacio. Descarga una copia si todavía puedes y libera almacenamiento antes de continuar.');return false}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){screen='home';let d=new Date(), greeting=d.getHours()<12?'Buenos días':d.getHours()<20?'Buenas tardes':'Buenas noches';let upcoming=events.filter(e=>e.date&&e.date>=today()&&e.date<=tomorrow()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);document.querySelector('#app').innerHTML=`<div class="top"><div class="eyebrow">Tu espacio personal</div><div class="date">${d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}</div></div><h1>${greeting}, Oihane 👋</h1><form class="assistant" id="assistant"><span class="bubble">✳️</span><input id="ask" placeholder="¿En qué te ayudo?" autocomplete="off"><button type="button" aria-label="Dictar por voz" onclick="startVoiceInput()">🎙️</button><button aria-label="Enviar">↗</button></form><div class="section-head"><h2>PRÓXIMAMENTE</h2><button onclick="openModule('Calendario')">Ver calendario</button></div><section class="upcoming">${upcoming.length?upcoming.map(e=>`<div class="event"><div class="event-date">${e.date===today()?'HOY':e.date===tomorrow()?'MAÑANA':fmt(e.date)}${e.time?'<br>'+esc(e.time):''}</div><div class="event-title">${esc(e.title)}${e.location?`<div class="item-meta">📍 ${esc(e.location)}</div>`:''}</div></div>`).join(''):'<div class="empty">De momento, tu agenda está tranquila 🌿</div>'}</section><div class="section-head"><h2>TUS ESPACIOS</h2></div><div class="grid">${modules.map(m=>`<button class="module" aria-label="${m[1]}" title="${m[1]}" onclick="openModule('${m[1]}')"><span class="emoji" aria-hidden="true">${m[0]}</span><span>${m[1]}</span></button>`).join('')}</div>`;document.querySelector('#assistant').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#ask').value.trim();if(!q)return;handleAssistantCommand(q)} }
function collectBackupData(){const data={format:'oihane-backup',version:5,createdAt:new Date().toISOString(),data:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('oihane_')&&!/^oihane_(sync_|last_version|last_upgrade_at|last_export_at|shown_reminders)/.test(k)){try{data.data[k]=JSON.parse(localStorage.getItem(k))}catch{data.data[k]=localStorage.getItem(k)}}}data.data.oihane_tasks=tasks;data.data.oihane_products=products;data.data.oihane_events=events;return data}
function exportBackup(){try{const data=collectBackupData();data.createdAt=new Date().toISOString();data.appVersion=document.querySelector('meta[name="oihane-version"]')?.content||'5.3.0';data.moduleKeys=Object.keys(data.data||{}).length;const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oihane-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);try{localStorage.setItem('oihane_last_export_at',data.createdAt)}catch{}const status=document.querySelector('#localBackupStatus');if(status)status.textContent='Copia descargada ahora. Guarda el archivo fuera de Oihane (por ejemplo, en iCloud Drive o en tu ordenador); las instantáneas locales no sustituyen esta copia externa.'}catch(e){alert('No se ha podido crear la copia. Comprueba el espacio disponible en el dispositivo.')}}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());let incoming={};if(parsed?.format==='oihane-backup'&&parsed.data&&typeof parsed.data==='object'&&!Array.isArray(parsed.data))incoming=parsed.data;else if(parsed&&typeof parsed==='object'&&(parsed.tasks||parsed.products||parsed.events||parsed.extras)){incoming.oihane_tasks=parsed.tasks;incoming.oihane_products=parsed.products;incoming.oihane_events=parsed.events;Object.entries(parsed.extras||{}).forEach(([k,v])=>incoming['oihane_'+k]=v)}else{alert('El archivo no parece una copia válida de Oihane. No se ha cambiado ningún dato.');return}const valid=Object.entries(incoming).filter(([k,v])=>k.startsWith('oihane_')&&!/^oihane_(sync_|last_version|last_upgrade_at|last_export_at|shown_reminders)/.test(k)&&v!==undefined);if(!valid.length){alert('La copia no contiene datos reconocibles de Oihane.');return}const created=parsed.createdAt?new Date(parsed.createdAt).toLocaleString('es-ES'):'fecha desconocida';const mode=prompt('Archivo: '+file.name+'\nFecha de la copia: '+created+'\nMódulos/almacenes incluidos: '+valid.length+'\n\nElige cómo restaurar:\n1 = REEMPLAZAR los módulos incluidos (los datos locales de esos módulos se sustituirán).\n2 = FUSIONAR (solo añade elementos que falten; conserva los datos actuales).','2');if(!['1','2'].includes(mode||''))return;if(mode==='1'&&!confirm('Última comprobación: se reemplazarán los datos locales de los módulos incluidos. Descarga primero una copia de los datos actuales si no lo has hecho. ¿Continuar?'))return;for(const [k,v] of valid){if(mode==='1'){localStorage.setItem(k,JSON.stringify(v));continue}let old;try{old=JSON.parse(localStorage.getItem(k)||'null')}catch{}if(Array.isArray(old)&&Array.isArray(v)){const map=new Map(old.map((x,i)=>[String(x?.id??'old-'+i),x]));v.forEach((x,i)=>{const id=String(x?.id??'new-'+i);if(!map.has(id))map.set(id,x)});localStorage.setItem(k,JSON.stringify([...map.values()]))}else if(old===null)localStorage.setItem(k,JSON.stringify(v))}tasks=readStore('oihane_tasks');products=readStore('oihane_products');events=readStore('oihane_events');save();await writeLocalSnapshot();home();alert('Restauración completada. '+(mode==='2'?'Se han añadido los elementos que faltaban sin borrar los datos actuales.':'Se han reemplazado los módulos incluidos.'))}catch(e){alert('No se ha podido leer o restaurar la copia. No sigas haciendo cambios si sospechas que el almacenamiento está lleno; conserva el archivo JSON original.')}};input.click()}
function openModule(name,seed=''){screen=name; if(name==='Tareas')renderTasks(seed);else if(name==='Compras')renderShopping(seed);else if(name==='Calendario')renderCalendar(seed);else renderExtraModule(name,seed)}
function renderTasks(seed=''){screen='Tareas';const pending=tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()" aria-label="Volver al inicio">‹</button><h1>📋 Tareas</h1></div><div class="dashboard-lead"><div class="eyebrow">Una lista, sin ruido</div><h2>${pending.length?`${pending.length} cosas por resolver`:'Todo al día ✨'}</h2><p>Ordenadas por fecha. Las tareas repetitivas vuelven a aparecer cuando toque.</p><div class="stat-pills"><span>${pending.filter(t=>t.date&&t.date<=today()).length} para hoy o atrasadas</span><span>${tasks.filter(t=>t.done).length} completadas</span></div></div><div class="module-toolbar"><span class="item-meta">PENDIENTES</span><button class="primary" type="button" onclick="toggleAddForm()">＋ Añadir tarea</button></div><section class="panel hidden" id="addPanel"><form id="taskForm"><div class="field"><label>Tarea</label><input id="taskInput" placeholder="¿Qué tienes que hacer?" value="${esc(seed)}" required></div><div class="field"><label>Fecha (opcional)</label><input id="taskDate" type="date"></div><div class="field"><label>Repetición</label><select id="taskRepeat"><option value="">Sin repetición</option><option>Diaria</option><option>Cada 2 días</option><option>Cada 3 días</option><option>Cada 4 días</option><option>Cada 5 días</option><option>Cada 6 días</option><option>Semanal</option><option>Cada 2 semanas</option><option>Cada 3 semanas</option><option>Cada 4 semanas</option><option>Mensual</option><option>Cada 2 meses</option><option>Cada 3 meses</option><option>Cada 6 meses</option><option>Anual</option><option>Días concretos</option><option>Personalizada</option></select></div><div class="field"><label>Intervalo personalizado (días)</label><input id="taskIntervalDays" type="number" min="1" max="365" value="7"></div><div class="field"><label>Días de la semana (para días concretos)</label><div class="subtabs" id="taskWeekdays">${["L","M","X","J","V","S","D"].map((d,i)=>`<label class="check-label"><input type="checkbox" value="${i+1}">${d}</label>`).join("")}</div></div><div class="field"><label>Importancia</label><select id="taskImportance"><option value="2">Normal</option><option value="3">Alta</option><option value="1">Baja</option></select></div><div class="field"><label>Categoría</label><select id="taskCategory"><option>Personal</option><option>Hogar</option><option>Trabajo</option><option>Salud</option><option>Estudio</option><option>Recados</option></select></div><div class="field"><label>Lugar (opcional)</label><input id="taskLocation" placeholder="Ej. supermercado, hospital…"></div><div class="field"><label>Contexto / vínculo (opcional)</label><input id="taskContext" placeholder="Ej. cuando esté en casa, compra, planta…"></div><div class="field"><label class="inline-check"><input id="taskNotify" type="checkbox"> Recordarme (requiere permiso del navegador)</label></div><div class="field"><label class="inline-check"><input id="taskShared" type="checkbox"> Compartida</label></div><button class="primary">Guardar tarea</button></form></section><section class="panel"><div id="taskList">${taskRows()}</div><div class="section-head" style="margin-top:14px"><h2>COMPLETADAS RECIENTEMENTE</h2><button id="completedHistoryButton" onclick="toggleCompletedHistory()">Ver historial completo</button></div><div id="completedTasks"></div></section>`;document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),title:document.querySelector('#taskInput').value.trim(),date:document.querySelector('#taskDate').value||'',repeat:document.querySelector('#taskRepeat').value,intervalDays:Number(document.querySelector('#taskIntervalDays').value||7),weekdays:[...document.querySelectorAll('#taskWeekdays input:checked')].map(x=>Number(x.value)),category:document.querySelector('#taskCategory').value,location:document.querySelector('#taskLocation').value.trim(),context:document.querySelector('#taskContext').value.trim(),importance:Number(document.querySelector('#taskImportance').value||2),notify:document.querySelector('#taskNotify').checked,shared:document.querySelector('#taskShared').checked,done:false,created:today(),completedAt:'',lastCompleted:''});save();renderTasks()};showCompletedTasks()}

function taskPriority(t){const due=t.date||'9999-12-31';const overdue=due<today()?100:due===today()?70:due===tomorrow()?45:0;return overdue+(Number(t.importance||2)*10)+(t.repeat?3:0)}
function taskRows(){let list=tasks.filter(t=>!t.done).sort((a,b)=>taskPriority(b)-taskPriority(a)||(a.date||'9999').localeCompare(b.date||'9999')||(a.location||'').localeCompare(b.location||''));return list.length?list.map(t=>`<div class="item"><input aria-label="Completar ${esc(t.title)}" type="checkbox" onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)} ${Number(t.importance)===3?'<span class="priority-high">· Alta</span>':''}</div><div class="item-meta">${t.date?fmt(t.date):'Sin fecha'}${t.repeat?' · '+esc(t.repeat):''}${t.category?' · '+esc(t.category):''}${t.location?' · 📍 '+esc(t.location):''}${t.context?' · '+esc(t.context):''}${t.notify?' · 🔔':''}${t.shared?' · Compartida':''}${t.lastCompleted?' · Última vez '+fmt(t.lastCompleted):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">No tienes tareas pendientes ✨</div>'}
function addMonthsClamped(date,months){const day=date.getDate();date.setDate(1);date.setMonth(date.getMonth()+months);const last=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();date.setDate(Math.min(day,last));return date}
function nextRepeatDate(t){let d=new Date((t.date||today())+'T12:00:00'),r=t.repeat||'';if(!r)return '';const m=r.match(/Cada (\d+) días?/i);if(m)d.setDate(d.getDate()+Number(m[1]));else if(r==='Diaria')d.setDate(d.getDate()+1);else if(r==='Semanal')d.setDate(d.getDate()+7);else if(r==='Cada 2 semanas')d.setDate(d.getDate()+14);else if(r==='Cada 3 semanas')d.setDate(d.getDate()+21);else if(r==='Cada 4 semanas')d.setDate(d.getDate()+28);else if(r==='Mensual')addMonthsClamped(d,1);else if(r==='Cada 2 meses')addMonthsClamped(d,2);else if(r==='Cada 3 meses')addMonthsClamped(d,3);else if(r==='Cada 6 meses')addMonthsClamped(d,6);else if(r==='Anual')addMonthsClamped(d,12);else if(r==='Días concretos'&&Array.isArray(t.weekdays)&&t.weekdays.length){for(let i=1;i<=7;i++){const c=new Date(d);c.setDate(c.getDate()+i);if(t.weekdays.includes(c.getDay()||7)){d=c;break}}}else if(r==='Personalizada')d.setDate(d.getDate()+Number(t.intervalDays||7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toggleTask(id){let t=tasks.find(t=>t.id===id);if(!t)return;if(!t.done){t.done=true;t.completedAt=today();t.lastCompleted=today();if(t.repeat){const next=nextRepeatDate(t);tasks.push({...t,id:Date.now()+Math.floor(Math.random()*999),date:next,done:false,created:today(),completedAt:'',lastCompleted:today()})}}else{t.done=false;t.completedAt=''}save();renderTasks()}
function deleteTask(id){if(!confirm('¿Eliminar esta tarea y su recurrencia actual?'))return;tasks=tasks.filter(t=>t.id!==id);save();renderTasks()}
let completedHistoryAll=false;function toggleCompletedHistory(){completedHistoryAll=!completedHistoryAll;showCompletedTasks();const b=document.querySelector('#completedHistoryButton');if(b)b.textContent=completedHistoryAll?'Mostrar recientes':'Ver historial completo'}function showCompletedTasks(){let el=document.querySelector('#completedTasks');if(!el)return;let done=tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));const total=done.length;if(!completedHistoryAll)done=done.slice(0,5);el.innerHTML=done.length?done.map(t=>`<div class="item done"><input type="checkbox" checked onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${t.completedAt?'Completada el '+fmt(t.completedAt):'Completada'}${t.lastCompleted?' · Última vez '+fmt(t.lastCompleted):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">Todavía no hay tareas completadas.</div>';const b=document.querySelector('#completedHistoryButton');if(b){b.textContent=completedHistoryAll?'Mostrar recientes':'Ver historial completo';b.style.display=total>5?'':'none'}}
function normalizeProductName(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim()}

}
function migrateProducts(){let changed=false;products=products.map(p=>{const lists=Array.isArray(p.lists)?[...new Set(p.lists)]:[...new Set(['General',p.store||'Lidl'])];const category=classifyProductCategory(p.title);const storeName=p.store||'Lidl';if(!Array.isArray(p.lists)||p.category!==category||p.store!==storeName)changed=true;return {...p,category,store:storeName,lists}});if(changed)save()}
migrateProducts();
function renderShopping(seed=''){screen='Compras';document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()">‹</button><h1>🛒 Compras</h1></div><div class="subtabs">${['General','Lidl','Eroski','Mercadona'].map(s=>`<button class="${store===s?'active':''}" onclick="setStore('${s}')">${s}</button>`).join('')}</div><section class="panel"><h3>${store==='General'?'LISTA GENERAL':'LISTA DE '+store.toUpperCase()}</h3><form class="add-row" id="productForm"><input id="productInput" placeholder="Añadir producto…" value="${esc(seed)}" required><button class="primary">Añadir</button></form><div class="item-meta" id="productCategoryHint" style="margin:-3px 0 12px">Categoría automática: ${esc(classifyProductCategory(seed||''))}</div><div class="subtabs"><button class="${!showBought?'active':''}" onclick="setBought(false)">Pendientes</button><button class="${showBought?'active':''}" onclick="setBought(true)">Comprados</button></div><div>${productRows()}</div></section><p class="hint">La lista General reúne los productos pendientes; cada producto también pertenece a su tienda habitual. Los nuevos se asignan a Lidl salvo que elijas otra tienda. Los datos se guardan en este dispositivo.</p>`;document.querySelector('#productInput').oninput=e=>{const hint=document.querySelector('#productCategoryHint');if(hint)hint.textContent='Categoría automática: '+classifyProductCategory(e.target.value)};document.querySelector('#productForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#productInput').value.trim();if(!title)return;const assignedStore=store==='General'?'Lidl':store;products.push({id:Date.now(),title,store:assignedStore,lists:[...new Set(['General',assignedStore])],category:classifyProductCategory(title),bought:false,created:today()});selectedProductIds.clear();save();renderShopping()}}
function setStore(s){store=s;showBought=false;selectedProductIds.clear();renderShopping()}function setBought(b){showBought=b;selectedProductIds.clear();renderShopping()}
function toggleSelectedProduct(id,checked){if(checked)selectedProductIds.add(id);else selectedProductIds.delete(id);const bar=document.querySelector('#bulkActions');if(bar)bar.classList.toggle('hidden',selectedProductIds.size===0);const count=document.querySelector('#selectedCount');if(count)count.textContent=selectedProductIds.size}
function productRows(){let arr=products.filter(p=>(p.lists||[]).includes(store)&&p.bought===showBought);if(!arr.length)return '<div class="empty-list">'+(showBought?'Todavía no has comprado nada de esta lista.':'Tu lista está vacía. Añade lo que necesites.')+'</div>';const row=p=>`<div class="item ${p.bought?'done':''}"><label class="check-label"><input aria-label="Marcar ${esc(p.title)} como comprado" type="checkbox" ${p.bought?'checked':''} onchange="toggleProduct(${p.id})">${p.bought?'Recuperar':'Comprado'}</label><label class="check-label"><input aria-label="Seleccionar ${esc(p.title)} para mover o copiar" type="checkbox" ${selectedProductIds.has(p.id)?'checked':''} onchange="toggleSelectedProduct(${p.id},this.checked)">Elegir</label><div class="item-main"><div class="item-title">${esc(p.title)}</div>${store==='General'?`<div class="item-meta">${esc(p.category||'Otros')} · ${esc(p.store||'Lidl')}</div>`:''}${p.sourceRecipe?`<div class="item-meta">Receta: ${esc(p.sourceRecipe)}</div>`:''}${p.sourceHomeTitle?`<div class="item-meta">Hogar: ${esc(p.sourceHomeTitle)}</div>`:''}</div><button class="delete" aria-label="Quitar ${esc(p.title)} de esta lista" onclick="deleteProduct(${p.id})">×</button></div>`;let body='';if(store==='General'&&!showBought){const order=[...productCategories];for(const cat of order){const group=arr.filter(p=>(p.category||'Otros')===cat);if(group.length)body+=`<div class="category-heading">${esc(cat)}</div>${group.map(row).join('')}`}const other=arr.filter(p=>!order.includes(p.category||'Otros'));if(other.length)body+=`<div class="category-heading">Otros</div>${other.map(row).join('')}`}else body=arr.map(row).join('');return `${body}<div class="panel ${selectedProductIds.size?'':'hidden'}" id="bulkActions" style="padding:12px;margin-top:12px"><div class="item-meta"><span id="selectedCount">${selectedProductIds.size}</span> seleccionados</div><div class="field"><label>Mover o copiar a</label><select id="targetList">${['General','Lidl','Eroski','Mercadona'].filter(x=>x!==store).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="add-row"><button class="primary" type="button" onclick="moveSelectedProducts(false)">Mover</button><button class="primary" type="button" onclick="moveSelectedProducts(true)">Copiar</button><button type="button" onclick="clearProductSelection()" style="background:#efecdf;border-radius:12px;padding:10px">Cancelar</button></div><div class="hint">Marca la segunda casilla de cada producto para seleccionarlo. La primera sirve para marcarlo como comprado.</div></div>`}
function clearProductSelection(){selectedProductIds.clear();renderShopping()}
function moveSelectedProducts(copy){const ids=[...selectedProductIds];if(!ids.length){alert('Selecciona al menos un producto.');return}const target=document.querySelector('#targetList')?.value;if(!target)return;const allPendingLidl=store==='Lidl'&&!showBought&&ids.length===products.filter(p=>(p.lists||[]).includes('Lidl')&&!p.bought).length;if(!copy&&allPendingLidl&&!confirm('Vas a mover todos los productos pendientes de Lidl. ¿Continuar?'))return;for(const id of ids){const p=products.find(x=>x.id===id);if(!p)continue;if(copy){const duplicate={...p,id:Date.now()+Math.floor(Math.random()*100000),store:target==='General'?(p.store||'Lidl'):target,lists:[target],bought:false};products.push(duplicate)}else{p.lists=(p.lists||[]).filter(l=>l!==store);if(!p.lists.includes(target))p.lists.push(target);if(target!=='General')p.store=target;if(!p.lists.length)products=products.filter(x=>x.id!==id)}}selectedProductIds.clear();save();renderShopping()}
function toggleProduct(id){let p=products.find(p=>p.id===id);if(p){p.bought=!p.bought;if(p.sourceHomeId){const homeItems=extraItems('Hogar'),h=homeItems.find(x=>x.id===p.sourceHomeId);if(h){h.purchased=!!p.bought;saveExtra('Hogar',homeItems)}}}selectedProductIds.delete(id);save();renderShopping()}function deleteProduct(id){const p=products.find(p=>p.id===id);if(p){p.lists=(p.lists||[]).filter(l=>l!==store);if(!p.lists.length)products=products.filter(x=>x.id!==id)}selectedProductIds.delete(id);save();renderShopping()}
function renderCalendar(seed=''){screen='Calendario';const future=events.filter(e=>e.date>=today()).sort((a,b)=>((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||'')));document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()" aria-label="Volver al inicio">‹</button><h1>📅 Calendario</h1></div><div class="dashboard-lead"><div class="eyebrow">Tu agenda</div><h2>${future.length?`${future.length} eventos próximos`:'Espacio para lo importante'}</h2><p>Consulta tus próximos compromisos, con hora, ubicación y detalles.</p><div class="stat-pills"><span>${future.filter(e=>e.date===today()).length} hoy</span><span>${future.filter(e=>e.date===tomorrow()).length} mañana</span></div></div><div class="module-toolbar"><div class="subtabs"><button class="active" onclick="setCalendarView('day',this)">Día</button><button onclick="setCalendarView('week',this)">Semana</button><button onclick="setCalendarView('month',this)">Mes</button><button onclick="setCalendarView('all',this)">Todos</button></div><button class="primary" type="button" onclick="toggleAddForm()">＋ Nuevo evento</button></div><section class="panel hidden" id="addPanel"><form id="eventForm"><div class="field"><label>Nombre</label><input id="eventTitle" placeholder="Ej. Cita médica" value="${esc(seed)}" required></div><div class="field"><label>Fecha</label><input id="eventDate" type="date" value="${today()}" required></div><div class="field"><label>Hora</label><input id="eventTime" type="time"></div><div class="field"><label>Duración</label><select id="eventDuration"><option value="30">30 minutos</option><option value="60" selected>1 hora</option><option value="90">1 h 30 min</option><option value="120">2 horas</option><option value="240">Medio día</option><option value="480">Día completo</option></select></div><div class="field"><label>Ubicación</label><input id="eventLocation" placeholder="Dirección, centro médico, restaurante…"></div><div class="field"><label>Personas (opcional)</label><input id="eventPeople" placeholder="Con quién quedas"></div><div class="field"><label>Notas (opcional)</label><textarea id="eventNotes" placeholder="Información útil, reserva, preparación…"></textarea></div><div class="field"><label class="inline-check"><input id="eventNotify" type="checkbox"> Aviso (el navegador debe permitir notificaciones)</label></div><div class="field"><label>Tiempo para salir antes (minutos)</label><input id="eventDeparture" type="number" min="0" step="5" placeholder="Ej. 30"></div><button class="primary">Guardar evento</button></form></section><section class="panel"><div id="calendarList">${calendarRows()}</div></section><p class="hint">Los eventos se guardan en el calendario interno de Oihane. La sincronización automática con Apple Calendar requiere una futura versión nativa.</p>`;document.querySelector('#eventForm').onsubmit=e=>{e.preventDefault();events.push({id:Date.now(),title:document.querySelector('#eventTitle').value.trim(),date:document.querySelector('#eventDate').value,time:document.querySelector('#eventTime').value,duration:document.querySelector('#eventDuration').value,location:document.querySelector('#eventLocation').value.trim(),people:document.querySelector('#eventPeople').value.trim(),notes:document.querySelector('#eventNotes').value.trim(),notify:document.querySelector('#eventNotify').checked,departureMinutes:document.querySelector('#eventDeparture').value||''});save();renderCalendar()}}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function setCalendarView(view,button){calendarView=view;document.querySelectorAll('.module-toolbar .subtabs button').forEach(b=>b.classList.remove('active'));button.classList.add('active');const list=document.querySelector('#calendarList');if(list)list.innerHTML=calendarRows()}
function calendarRows(){let base=events.slice();const start=new Date(today()+'T12:00:00'),end=new Date(start);if(calendarView==='day')end.setDate(end.getDate());else if(calendarView==='week'){const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);end.setTime(start.getTime());end.setDate(start.getDate()+6)}else if(calendarView==='month'){start.setDate(1);end.setMonth(end.getMonth()+1);end.setDate(0)}if(calendarView!=='all'){const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;base=base.filter(e=>e.date>=iso(start)&&e.date<=iso(end))}let arr=base.sort((a,b)=>((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||'')));return arr.length?arr.map(e=>`<div class="item"><div class="event-date">${e.date===today()?'HOY':e.date===tomorrow()?'MAÑANA':fmt(e.date)}${e.time?'<br>'+esc(e.time):''}</div><div class="item-main"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${e.location?'📍 '+esc(e.location):'Sin ubicación'}${e.duration?' · '+(e.duration>=480?'Día completo':e.duration+' min'):''}${e.people?' · '+esc(e.people):''}</div>${e.notes?`<div class="item-meta">${esc(e.notes)}</div>`:''}</div><button class="delete" onclick="deleteEvent(${e.id})">×</button></div>`).join(''):'<div class="empty-list">Todavía no hay eventos. Añade tu primera cita arriba.</div>'}function deleteEvent(id){if(!confirm('¿Eliminar este evento?'))return;events=events.filter(e=>e.id!==id);save();renderCalendar()}

function sectionFor(name,item){if(name==='Wishlist')return item.status==='Buscando'?'BUSCANDO':item.status==='Idea'?'IDEAS':'PRODUCTOS';if(name==='Regalos')return item.status==='Entregado'?'HISTORIAL':['Comprado','Pedido','En camino'].includes(item.status)?'COMPRADOS':item.status==='Buscando'?'BUSCANDO':item.status==='Idea'?'IDEAS':'PRÓXIMOS REGALOS';if(name==='Hogar')return item.status==='Seguimiento de pedidos'?'SEGUIMIENTO DE PEDIDOS':item.status.toUpperCase();if(name==='Plantas')return item.status==='En observación'?'EVOLUCIÓN':(item.status==='Necesita atención'||(item.date&&item.date<=today()))?'NECESITAN ATENCIÓN':'MIS PLANTAS';if(name==='Recetas')return item.status==='Habitual'?'MIS RECETAS HABITUALES':item.status==='Quiero aprender'?'QUIERO APRENDER':item.status==='Esta semana'?'ESTA SEMANA':'QUIERO PROBAR';if(name==='Estudio')return item.status==='Curso'?'CURSOS':'PENDIENTES';if(name==='Viajes')return item.status==='Próximamente'?'PRÓXIMAMENTE':item.status==='Viaje realizado'?'VIAJES REALIZADOS':'IDEAS';if(name==='Cultura'){if(item.kind==='Libro')return ['Leído / visto','Leído'].includes(item.status)?'LIBROS LEÍDOS':'LIBROS PENDIENTES';if(item.kind==='Arte')return 'ARTE';if(item.kind==='Museo')return 'MUSEOS';return ['Leído / visto','Visto'].includes(item.status)?'HISTORIAL':'PELÍCULAS Y SERIES'}if(name==='Planes')return item.status==='Sin fecha'?'SIN FECHA':item.status==='Realizado'?'HISTORIAL':'PRÓXIMOS';if(name==='Más')return item.status==='Integración'?'INTEGRACIONES':item.status==='Privacidad'?'PRIVACIDAD':'PREFERENCIAS';return 'OTROS'}

async function compressPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=720,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.58))};img.src=reader.result};reader.readAsDataURL(file)})}

function parseRecipeIngredient(line){let raw=String(line||'').trim().replace(/^[-•*]\s*/,'');if(!raw)return null;const pipe=raw.match(/^([^|]+)\|\s*(.+)$/);if(pipe){const qtyText=pipe[1].trim(),name=pipe[2].trim(),m=qtyText.match(/^([\d.,/ ]+)\s*(.*)$/);return {quantity:m?m[1].trim():'',unit:m?m[2].trim():'',name,display:(qtyText+' '+name).trim()}}const m=raw.match(/^((?:\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?))\s*(.*)$/);if(!m){const clean=raw.replace(/\s+al gusto\s*$/i,'').trim();return {quantity:'',unit:'',name:clean,display:clean}}let quantity=m[1].replace(/,/g,'.').replace(/\s/g,'').trim(),rest=m[2].trim();const units=/^(kg|g|mg|ml|cl|dl|l|cucharadas?|cucharaditas?|cdas?\.?|cdtas?\.?|tazas?|vasos?|latas?|ramas?|dientes?|rebanadas?|pizcas?|puñados?|hojas?|lonchas?|unidades?)\b\s*(?:de\s+)?(.*)$/i;const um=rest.match(units);let unit='',name=rest;if(um&&um[2].trim()){unit=um[1];name=um[2].trim()}else if(um&&!um[2].trim()){name=rest}return {quantity,unit,name,display:[quantity,unit,name].filter(Boolean).join(' ')}}
function parseRecipeIngredients(text){return String(text||'').split(/\r?\n|;|,\s+/).map(parseRecipeIngredient).filter(x=>x&&x.name.trim())}
function recipeIngredientsForDisplay(recipe){const items=parseRecipeIngredients(recipe.ingredients);const base=Number(recipe.servings)||1,current=Number(recipe.currentServings||recipe.servings)||base,ratio=current/base;return items.map(x=>{let quantity=x.quantity;if(quantity){let n;if(quantity.includes('/')){const parts=quantity.split('/');n=Number(parts[0])/Number(parts[1])}else n=Number(quantity);if(Number.isFinite(n)){const scaled=n*ratio;quantity=Number.isInteger(scaled)?String(scaled):String(Math.round(scaled*100)/100)}}return {...x,display:[quantity,x.unit,x.name].filter(Boolean).join(' ')}})}

function allOihaneData(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('oihane_')&&!/^oihane_(sync_|last_version|last_upgrade_at|last_export_at|shown_reminders)/.test(k)){try{out[k]=JSON.parse(localStorage.getItem(k))}catch{out[k]=localStorage.getItem(k)}}}return out}
function openRecoveryDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB no disponible'));return}const req=indexedDB.open('OihaneRecovery',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

function mergeDataIntoLocal(incoming){for(const [k,v] of Object.entries(incoming||{})){if(!k.startsWith('oihane_')||/^oihane_(sync_|last_version|last_upgrade_at|last_export_at|shown_reminders)/.test(k))continue;let old;try{old=JSON.parse(localStorage.getItem(k)||'null')}catch{}if(Array.isArray(old)&&Array.isArray(v)){const map=new Map(old.map((x,i)=>[String(x?.id??'old-'+i),x]));v.forEach((x,i)=>{const id=String(x?.id??'new-'+i);if(!map.has(id))map.set(id,x)});localStorage.setItem(k,JSON.stringify([...map.values()]))}else if(old===null)localStorage.setItem(k,JSON.stringify(v))}}
function saveSyncConfig(){const url=document.querySelector('#syncUrl')?.value.trim().replace(/\/$/,'')||'',key=document.querySelector('#syncKey')?.value.trim()||'';if(!/^https:\/\/.+\.supabase\.co$/.test(url)||!key){alert('Introduce la URL https://…supabase.co y la clave pública del proyecto.');return}localStorage.setItem('oihane_sync_url',url);localStorage.setItem('oihane_sync_key',key);const st=document.querySelector('#cloudStatus');if(st)st.textContent='Configuración guardada en este dispositivo. Inicia sesión para sincronizar.';return true}

function restoreSettingsIntoUI(){const c=syncConfig();const u=document.querySelector('#syncUrl'),k=document.querySelector('#syncKey'),e=document.querySelector('#syncEmail'),st=document.querySelector('#cloudStatus');if(u)u.value=c.url;if(k)k.value=c.key;if(e)e.value='';if(st)st.textContent=c.access?'Sesión Supabase activa en este dispositivo.':'Sincronización en la nube aún no conectada.';const n=document.querySelector('#notifStatus');if(n)n.textContent='Permiso de notificaciones: '+(('Notification'in window)?Notification.permission:'no disponible')+'.';const local=document.querySelector('#localBackupStatus');if(local){openRecoveryDB().then(db=>new Promise(resolve=>{const tx=db.transaction('snapshots','readonly'),r=tx.objectStore('snapshots').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve([])})).then(rows=>{const snap=rows.length?'Hay '+rows.length+' instantáneas locales. Última: '+new Date(rows.sort((a,b)=>b.id-a.id)[0].createdAt).toLocaleString('es-ES'):'Se creará una copia de recuperación al guardar cambios.';let ext='';try{const t=localStorage.getItem('oihane_last_export_at');if(t)ext=' Última descarga JSON registrada en este dispositivo: '+new Date(t).toLocaleString('es-ES')+'.'}catch{}local.textContent=snap+ext+' Recuerda guardar el archivo JSON en otro dispositivo o en iCloud Drive.'}).catch(()=>local.textContent='Este navegador no permite instantáneas locales; usa la copia JSON.') }}
function safeUpgradeSnapshot(){// No migramos ni borramos las claves existentes. Guardamos un registro de versión ligero, sin duplicar fotos ni agotar el almacenamiento.
 try{const v=document.querySelector('meta[name="oihane-version"]')?.content||'4.0.0';const previous=localStorage.getItem('oihane_last_version');if(previous!==v){localStorage.setItem('oihane_last_version',v);localStorage.setItem('oihane_last_upgrade_at',new Date().toISOString())}}catch(e){}
}

safeUpgradeSnapshot();home();queueLocalSnapshot();if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});scheduleForegroundReminderCheck();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(snapshotTimer);writeLocalSnapshot()} });
