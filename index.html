<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Oihane"><link rel="manifest" href="manifest.json"><title>Oihane</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#30372c;--muted:#777b70;--olive:#7d8764;--line:#e8e2d5;--accent:#e8eddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:680px;margin:auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.date{font-size:13px;color:var(--muted)}h1{font-size:29px;margin:8px 0 18px;letter-spacing:-.04em}.assistant{display:flex;gap:10px;align-items:center;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:22px}.assistant .bubble{font-size:22px}.assistant input{background:transparent;border:0;outline:0;min-width:0;flex:1;color:var(--ink)}.assistant button{background:var(--accent);border-radius:12px;padding:9px 11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.section-head h2{font-size:12px;letter-spacing:.12em;margin:0;color:var(--muted)}.section-head button{background:none;color:var(--olive);font-size:13px}.upcoming{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:23px}.empty{font-size:14px;color:var(--muted);padding:6px 0}.event{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event-date{font-size:11px;color:var(--olive);min-width:50px;font-weight:700;text-transform:uppercase}.event-title{font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.module{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:102px;padding:15px 8px;text-align:center;color:var(--ink);box-shadow:0 2px 4px #3b392b05}.module:active{transform:scale(.98)}.emoji{font-size:27px;display:block;margin-bottom:9px}.module span:last-child{font-size:12px;font-weight:600}.screen-head{display:flex;align-items:center;gap:12px;margin:4px 0 22px}.back{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;color:var(--ink)}.screen-head h1{margin:0;font-size:25px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px}.panel h3{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 13px}.add-row{display:flex;gap:8px;margin-bottom:13px}.add-row input,.add-row select,.field input,.field select{min-width:0;flex:1;border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:12px;color:var(--ink)}.primary{background:var(--olive);color:white;padding:12px 15px;border-radius:12px;font-weight:600}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.subtabs button{background:#efecdf;color:var(--muted);border-radius:12px;padding:9px 12px;font-size:13px}.subtabs button.active{background:var(--accent);color:var(--ink);font-weight:700}.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item input[type=checkbox]{accent-color:var(--olive);width:18px;height:18px}.item-main{flex:1;min-width:0}.item-title{font-size:14px;overflow-wrap:anywhere}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}.done .item-title{text-decoration:line-through;color:var(--muted)}.delete{background:transparent;color:#a09c90;font-size:18px;padding:4px 7px}.empty-list{color:var(--muted);font-size:14px;padding:10px 0}.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}.hidden{display:none!important}@media(min-width:500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.module{min-height:112px}}
</style></head><body><main class="app" id="app"></main>
<script>
const modules=[['🛒','Compras'],['📅','Calendario'],['❤️','Wishlist'],['🎁','Regalos'],['🏡','Hogar'],['🌱','Plantas'],['🍝','Recetas'],['📖','Estudio'],['✈️','Viajes'],['🎨','Cultura'],['🗓️','Planes'],['📋','Tareas'],['⚙️','Más']];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const readStore=(key)=>{try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}};const fmt=d=>{if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})};
let tasks=readStore('oihane_tasks'), products=readStore('oihane_products'), events=readStore('oihane_events');let screen='home',store='Lidl',showBought=false;
const save=()=>{localStorage.setItem('oihane_tasks',JSON.stringify(tasks));localStorage.setItem('oihane_products',JSON.stringify(products));localStorage.setItem('oihane_events',JSON.stringify(events))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){screen='home';let d=new Date(), greeting=d.getHours()<12?'Buenos días':d.getHours()<20?'Buenas tardes':'Buenas noches';let upcoming=events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);document.querySelector('#app').innerHTML=`<div class="top"><div class="eyebrow">Tu espacio personal</div><div class="date">${d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}</div></div><h1>${greeting}, Oihane 👋</h1><form class="assistant" id="assistant"><span class="bubble">✳️</span><input id="ask" placeholder="¿En qué te ayudo?" autocomplete="off"><button aria-label="Enviar">↗</button></form><div class="section-head"><h2>PRÓXIMAMENTE</h2><button onclick="openModule('Calendario')">Ver calendario</button></div><section class="upcoming">${upcoming.length?upcoming.map(e=>`<div class="event"><div class="event-date">${fmt(e.date)}${e.time?'<br>'+esc(e.time):''}</div><div class="event-title">${esc(e.title)}</div></div>`).join(''):'<div class="empty">De momento, tu agenda está tranquila 🌿</div>'}</section><div class="section-head"><h2>TUS ESPACIOS</h2></div><div class="grid">${modules.map(m=>`<button class="module" onclick="openModule('${m[1]}')"><span class="emoji">${m[0]}</span><span>${m[1]}</span></button>`).join('')}</div>`;document.querySelector('#assistant').onsubmit=e=>{e.preventDefault();let q=document.querySelector('#ask').value.trim();if(!q)return;if(/compra|leche|supermercado/i.test(q)){openModule('Compras',q)}else if(/tarea|pendiente|limpiar|estudiar/i.test(q)){openModule('Tareas',q)}else if(/calendario|evento|cita/i.test(q)){openModule('Calendario',q)}else{alert('El asistente inteligente aún está pendiente. Por ahora puedes entrar en Compras, Tareas o Calendario para guardar esa información.')}}}
function openModule(name,seed=''){screen=name; if(name==='Tareas')renderTasks(seed);else if(name==='Compras')renderShopping(seed);else if(name==='Calendario')renderCalendar(seed);else renderExtraModule(name,seed)}
function renderTasks(seed=''){screen='Tareas';document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()">‹</button><h1>📋 Tareas</h1></div><section class="panel"><h3>AÑADIR TAREA</h3><form class="add-row" id="taskForm"><input id="taskInput" placeholder="¿Qué tienes que hacer?" value="${esc(seed)}" required><button class="primary">Añadir</button></form><div class="field"><label>Fecha (opcional)</label><input id="taskDate" type="date"></div><div class="field"><label>Repetición</label><select id="taskRepeat"><option value="">Sin repetición</option><option>Diaria</option><option>Semanal</option><option>Mensual</option><option>Anual</option></select></div></section><section class="panel"><h3>PENDIENTES · ${tasks.filter(t=>!t.done).length}</h3><div id="taskList">${taskRows()}</div><button class="subtabs" onclick="showCompletedTasks()">Ver completadas</button><div id="completedTasks"></div></section>`;document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),title:document.querySelector('#taskInput').value.trim(),date:document.querySelector('#taskDate').value,repeat:document.querySelector('#taskRepeat').value,done:false});save();renderTasks()};}
function taskRows(){let list=tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return list.length?list.map(t=>`<div class="item"><input type="checkbox" onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${t.date?fmt(t.date):'Sin fecha'}${t.repeat?' · '+esc(t.repeat):''}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">No tienes tareas pendientes ✨</div>'}
function toggleTask(id){let t=tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();renderTasks()}function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);save();renderTasks()}function showCompletedTasks(){let el=document.querySelector('#completedTasks');let done=tasks.filter(t=>t.done);el.innerHTML=done.length?done.map(t=>`<div class="item done"><input type="checkbox" checked onchange="toggleTask(${t.id})"><div class="item-main"><div class="item-title">${esc(t.title)}</div></div><button class="delete" onclick="deleteTask(${t.id})">×</button></div>`).join(''):'<div class="empty-list">Todavía no hay tareas completadas.</div>'}
function renderShopping(seed=''){screen='Compras';document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()">‹</button><h1>🛒 Compras</h1></div><div class="subtabs">${['General','Lidl','Eroski','Mercadona'].map(s=>`<button class="${store===s?'active':''}" onclick="setStore('${s}')">${s}</button>`).join('')}</div><section class="panel"><h3>${store==='General'?'LISTA GENERAL':'LISTA DE '+store.toUpperCase()}</h3><form class="add-row" id="productForm"><input id="productInput" placeholder="Añadir producto…" value="${esc(seed)}" required><button class="primary">Añadir</button></form><div class="subtabs"><button class="${!showBought?'active':''}" onclick="setBought(false)">Pendientes</button><button class="${showBought?'active':''}" onclick="setBought(true)">Comprados</button></div><div>${productRows()}</div></section><p class="hint">Los productos se guardan en este dispositivo. Aún no hay sincronización entre dispositivos.</p>`;document.querySelector('#productForm').onsubmit=e=>{e.preventDefault();products.push({id:Date.now(),title:document.querySelector('#productInput').value.trim(),store:store==='General'?'Lidl':store,bought:false});save();renderShopping()}}
function setStore(s){store=s;showBought=false;renderShopping()}function setBought(b){showBought=b;renderShopping()}function productRows(){let arr=products.filter(p=>(store==='General'||p.store===store)&&p.bought===showBought);return arr.length?arr.map(p=>`<div class="item ${p.bought?'done':''}"><input type="checkbox" ${p.bought?'checked':''} onchange="toggleProduct(${p.id})"><div class="item-main"><div class="item-title">${esc(p.title)}</div>${store==='General'?`<div class="item-meta">${esc(p.store)}</div>`:''}</div><button class="delete" onclick="deleteProduct(${p.id})">×</button></div>`).join(''):'<div class="empty-list">'+(showBought?'Todavía no has comprado nada de esta lista.':'Tu lista está vacía. Añade lo que necesites.')+'</div>'}function toggleProduct(id){let p=products.find(p=>p.id===id);if(p)p.bought=!p.bought;save();renderShopping()}function deleteProduct(id){products=products.filter(p=>p.id!==id);save();renderShopping()}
function renderCalendar(seed=''){screen='Calendario';document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()">‹</button><h1>📅 Calendario</h1></div><section class="panel"><h3>NUEVO EVENTO</h3><form id="eventForm"><div class="field"><label>Nombre</label><input id="eventTitle" placeholder="Ej. Cita médica" value="${esc(seed)}" required></div><div class="field"><label>Fecha</label><input id="eventDate" type="date" value="${today()}" required></div><div class="field"><label>Hora (opcional)</label><input id="eventTime" type="time"></div><button class="primary">Guardar evento</button></form></section><section class="panel"><h3>PRÓXIMOS EVENTOS</h3>${calendarRows()}</section><p class="hint">Este calendario es interno a la primera versión; todavía no se sincroniza con Apple Calendar.</p>`;document.querySelector('#eventForm').onsubmit=e=>{e.preventDefault();events.push({id:Date.now(),title:document.querySelector('#eventTitle').value.trim(),date:document.querySelector('#eventDate').value,time:document.querySelector('#eventTime').value});save();renderCalendar()}}
function calendarRows(){let arr=events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return arr.length?arr.map(e=>`<div class="item"><div class="event-date">${fmt(e.date)}${e.time?'<br>'+esc(e.time):''}</div><div class="item-main"><div class="item-title">${esc(e.title)}</div></div><button class="delete" onclick="deleteEvent(${e.id})">×</button></div>`).join(''):'<div class="empty-list">No hay eventos próximos.</div>'}function deleteEvent(id){events=events.filter(e=>e.id!==id);save();renderCalendar()}

const extraConfig={
 'Wishlist':{key:'wishlist',intro:'Guarda productos e ideas que quieras investigar antes de comprar.',noun:'producto o idea',placeholder:'Ej. Aspiradora sin cable',status:['Idea','Buscando','Elegido','Comprado'],sections:['PRODUCTOS','IDEAS','BUSCANDO']},
 'Regalos':{key:'gifts',intro:'Organiza ideas y regalos por persona. Los regalos para Rubén se mantienen privados en este dispositivo.',noun:'regalo o persona',placeholder:'Ej. Idea de regalo para Rubén',status:['Idea','Buscando','Elegido','Comprado','Pedido','En camino','Entregado'],sections:['PRÓXIMOS REGALOS','IDEAS','COMPRADOS']},
 'Hogar':{key:'home',intro:'Cada estancia tiene compras pendientes, inspiración y opciones.',noun:'idea para casa',placeholder:'Ej. Lámpara de sobremesa',status:['Cosas fijas que comprar','Inspiración','Opciones'],sections:['COSAS FIJAS QUE COMPRAR','INSPIRACIÓN','OPCIONES'],rooms:['Baño principal','Baño de invitados','Dormitorio','Despacho-vestidor','Habitación de invitados','Salón-comedor','Terraza']},
 'Plantas':{key:'plants',intro:'Registra cuidados, ubicación y observaciones de cada planta.',noun:'planta',placeholder:'Ej. Monstera',status:['Necesita atención','Bien','En observación'],sections:['NECESITAN ATENCIÓN','MIS PLANTAS','EVOLUCIÓN']},
 'Recetas':{key:'recipes',intro:'Guarda recetas, ideas para probar y platos habituales. Puedes anotar ingredientes y pasos.',noun:'receta',placeholder:'Ej. Carbonara',status:['Quiero probar','Quiero aprender','Habitual','Cocinada'],sections:['ESTA SEMANA','QUIERO PROBAR','QUIERO APRENDER','MIS RECETAS HABITUALES']},
 'Estudio':{key:'study',intro:'Organiza cursos y pendientes de lectura, vídeos o estudio.',noun:'curso o pendiente',placeholder:'Ej. Repasar endocarditis',status:['Curso','Pendiente','En espera'],sections:['CURSOS','PENDIENTES']},
 'Viajes':{key:'trips',intro:'Guarda destinos que te apetecen, próximos viajes y recuerdos de viajes realizados.',noun:'destino o viaje',placeholder:'Ej. Lago di Como',status:['Quiero ir','Próximamente','Viaje realizado'],sections:['PRÓXIMAMENTE','IDEAS','VIAJES REALIZADOS']},
 'Cultura':{key:'culture',intro:'Tu biblioteca cultural: libros, arte y películas/series.',noun:'libro, obra o película',placeholder:'Ej. Dune',status:['Pendiente','Leído / visto','Obra de arte','Quiero ver en persona'],sections:['LIBROS','ARTE','PELÍCULAS Y SERIES']},
 'Planes':{key:'plans',intro:'Ideas de planes con o sin fecha. Si añades fecha, puedes crear también un evento en el calendario interno.',noun:'plan',placeholder:'Ej. Ir a un spa en pareja',status:['Sin fecha','Próximo','Realizado'],sections:['PRÓXIMOS','SIN FECHA']},
 'Más':{key:'more',intro:'Preferencias y opciones de Oihane. Las integraciones avanzadas aún no están conectadas.',noun:'nota o preferencia',placeholder:'Ej. Preferencia que quiero revisar',status:['Preferencia','Recordatorio','Pendiente','Integración','Privacidad'],sections:['PREFERENCIAS','INTEGRACIONES','PRIVACIDAD']}
};
let extraCurrent='Wishlist', extraFilter='Todos';
function extraItems(name){const c=extraConfig[name];try{return JSON.parse(localStorage.getItem('oihane_'+c.key)||'[]')}catch{return []}}
function saveExtra(name,items){localStorage.setItem('oihane_'+extraConfig[name].key,JSON.stringify(items))}
function sectionFor(name,item){if(name==='Wishlist')return item.status==='Buscando'?'BUSCANDO':item.status==='Idea'?'IDEAS':'PRODUCTOS';if(name==='Regalos')return ['Comprado','Pedido','En camino','Entregado'].includes(item.status)?'COMPRADOS':item.status==='Buscando'?'IDEAS':'PRÓXIMOS REGALOS';if(name==='Hogar')return item.status.toUpperCase();if(name==='Plantas')return item.status==='Necesita atención'?'NECESITAN ATENCIÓN':item.status==='En observación'?'EVOLUCIÓN':'MIS PLANTAS';if(name==='Recetas')return item.status==='Habitual'?'MIS RECETAS HABITUALES':item.status==='Quiero aprender'?'QUIERO APRENDER':item.status==='Cocinada'?'ESTA SEMANA':'QUIERO PROBAR';if(name==='Estudio')return item.status==='Curso'?'CURSOS':'PENDIENTES';if(name==='Viajes')return item.status==='Próximamente'?'PRÓXIMAMENTE':item.status==='Viaje realizado'?'VIAJES REALIZADOS':'IDEAS';if(name==='Cultura')return item.kind==='Libro'?'LIBROS':item.kind==='Arte'?'ARTE':'PELÍCULAS Y SERIES';if(name==='Planes')return item.status==='Sin fecha'?'SIN FECHA':'PRÓXIMOS';if(name==='Más')return item.status==='Integración'?'INTEGRACIONES':item.status==='Privacidad'?'PRIVACIDAD':'PREFERENCIAS';return 'OTROS'}
function renderExtraModule(name,seed=''){if(!extraConfig[name])return;extraCurrent=name;extraFilter='Todos';const c=extraConfig[name],emoji=modules.find(m=>m[1]===name)?.[0]||'✨';const roomOptions=c.rooms?`<div class="field"><label>Estancia</label><select id="extraRoom">${c.rooms.map(r=>`<option>${r}</option>`).join('')}</select></div>`:'';const kindOptions=name==='Cultura'?'<div class="field"><label>Tipo</label><select id="extraKind"><option>Libro</option><option>Película/serie</option><option>Arte</option></select></div>':'';const dateLabel=name==='Plantas'?'Próximo cuidado (opcional)':name==='Viajes'?'Fecha de inicio (opcional)':name==='Regalos'?'Fecha importante (opcional)':name==='Recetas'?'Fecha para esta semana (opcional)':'Fecha (opcional)';document.querySelector('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="home()">‹</button><h1>${emoji} ${name}</h1></div><section class="panel"><div class="empty">${c.intro}</div></section><section class="panel"><h3>AÑADIR ${c.noun.toUpperCase()}</h3><form id="extraForm"><div class="field"><label>Nombre</label><input id="extraTitle" placeholder="${c.placeholder}" value="${esc(seed)}" required></div>${kindOptions}${roomOptions}<div class="field"><label>Estado / categoría</label><select id="extraStatus">${c.status.map(st=>`<option>${st}</option>`).join('')}</select></div><div class="field"><label>${dateLabel}</label><input id="extraDate" type="date"></div><div class="field"><label>Notas (opcional)</label><input id="extraNotes" placeholder="Detalles, enlaces, ingredientes, ubicación…"></div><button class="primary" type="submit">Guardar</button></form></section><section class="panel"><h3><span id="extraSectionTitle">${c.sections[0]}</span> · <span id="extraCount">0</span></h3><div id="extraList"></div>${c.sections.length>1?`<div class="subtabs" style="margin-top:14px">${c.sections.map((sec,i)=>`<button class="${i===0?'active':''}" id="exTab${i}" onclick="filterExtra('${esc(sec)}',this)">${sec==='PRÓXIMAMENTE'?'Próximos':sec==='COSAS FIJAS QUE COMPRAR'?'Compras fijas':sec==='NECESITAN ATENCIÓN'?'Atención':sec==='MIS RECETAS HABITUALES'?'Habituales':sec==='PELÍCULAS Y SERIES'?'Películas/series':sec==='VIAJES REALIZADOS'?'Realizados':sec==='PRÓXIMOS REGALOS'?'Próximos':sec==='PREFERENCIAS'?'Preferencias':sec==='INTEGRACIONES'?'Integraciones':sec==='PRIVACIDAD'?'Privacidad':sec==='ESTA SEMANA'?'Esta semana':sec==='MIS PLANTAS'?'Mis plantas':sec==='QUIERO PROBAR'?'Quiero probar':sec==='QUIERO APRENDER'?'Quiero aprender':sec==='SIN FECHA'?'Sin fecha':sec==='PRODUCTOS'?'Productos':sec==='IDEAS'?'Ideas':sec==='BUSCANDO'?'Buscando':sec==='CURSOS'?'Cursos':sec==='PENDIENTES'?'Pendientes':sec==='LIBROS'?'Libros':sec==='ARTE'?'Arte':sec==='COMPRADOS'?'Comprados':sec==='OPCIONES'?'Opciones':sec==='INSPIRACIÓN'?'Inspiración':sec==='VIAJES REALIZADOS'?'Realizados':sec==='EVOLUCIÓN'?'Evolución':sec==='PRÓXIMOS'?'Próximos':sec}</button>`).join('')}</div>`:''}</section><p class="hint">Los datos se guardan localmente en este dispositivo. No hay todavía sincronización entre dispositivos ni conexiones externas.</p>`;document.querySelector('#extraForm').onsubmit=e=>{e.preventDefault();const items=extraItems(name);items.push({id:Date.now(),title:document.querySelector('#extraTitle').value.trim(),status:document.querySelector('#extraStatus').value,date:document.querySelector('#extraDate').value,notes:document.querySelector('#extraNotes').value.trim(),room:document.querySelector('#extraRoom')?.value||'',kind:document.querySelector('#extraKind')?.value||'',created:today()});saveExtra(name,items);renderExtraModule(name)};renderExtraList(name,c.sections[0]);}
function filterExtra(section,button){document.querySelectorAll('.subtabs button').forEach(b=>b.classList.remove('active'));button.classList.add('active');renderExtraList(extraCurrent,section)}
